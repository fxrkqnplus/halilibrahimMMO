# =========================================================
# hmmo-client - HalilIbrahimMMO eşlik istemci mod'u
# =========================================================
# Bu, kök derlemeden BAĞIMSIZ bir Gradle projesidir. Kökteki
# `./gradlew build` bu klasörü derlemez ve shadowJar çıktısını etkilemez.
#
# Buradaki anahtar adları ve sürümler, Fabric'in 26.2 için ürettiği resmi
# şablondan (fabricmc.net/develop/template) birebir doğrulanmıştır.

org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA henuz configuration cache ile tam uyumlu degil (Fabric sablonu
# da bunu kapali gonderiyor).
org.gradle.configuration-cache=false

# Fabric surumleri - fabricmc.net/develop uzerinden kontrol edilir.
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod ozellikleri
# DIKKAT: mod_id kalicidir. Yayinlandiktan sonra degistirilirse mod'u kurmus
# her oyuncu sunucunun dogrulamasini gecemez.
mod_id=hmmo-client
mod_version=1.2.0
maven_group=com.halilibrahim.halilibrahimmmo.client

# Bagimliliklar
# Sunucu paketindeki surum 0.154.2+26.2; sablon 0.156.0+26.2 oneriyor.
# Oyuncularin sahip olmadigi bir API'ye derlememek icin paketteki surum
# kullaniliyor (modlar.yml'deki minimum ile ayni).
fabric_api_version=0.154.2+26.2
