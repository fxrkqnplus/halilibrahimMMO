# =====================================================================
#  HalilIbrahimMMO - Dünya Bossları
# =====================================================================
#  Belirli aralıklarla haritada, çevrimiçi bir oyuncunun birkaç yüz blok
#  uzağında bir dünya bossu belirir ve koordinatlarıyla birlikte tüm
#  sunucuya duyurulur. Boss, adı ve nadirliği olan, çok güçlendirilmiş
#  bir yaratıktır; sunucu yeniden başlasa bile ödülleriyle birlikte
#  yerinde kalır.
#
#  NADİRLİK: "agirlik" bir yüzde DEĞİL, bir paydır. Bir nadirliğin çıkma
#  ihtimali = kendi ağırlığı / bütün ağırlıkların toplamı. Yüzde yerine
#  ağırlık kullanılmasının sebebi basit: toplamı 100 etmeyen bir yüzde
#  listesi sessiz bir hatadır, ağırlık listesi ise her zaman geçerlidir.
#  Aşağıdaki 49/30/20/10/1 dağılımı istenen "sıradan çok, mistik neredeyse
#  hiç" oranını korur.
#
#  Her nadirlik şunları belirler:
#    can-carpani / hasar-carpani / hiz-carpani : temel yaratığın kaç katı
#    silahlar     : hangi silah türü hangi eşyaya karşılık gelir
#    zirh         : sırasıyla kask, göğüslük, pantolon, bot (en fazla 4)
#    kacar        : canı %25'in altına düşünce uzağa ışınlanıp kaçar
#    isinlanir    : savaş sırasında oyuncuya doğru kısa ışınlamalar yapar
#    iksir-icer   : canı yarıya düşünce kendine yenilenme basar
#    sinif-xp     : öldüren oyuncunun sınıfına yazılan XP
#    oyun-xp      : yere düşen normal Minecraft tecrübesi
#    zenginlik    : öldüren oyuncuya yazılan Zenginlik Puanı
#    ganimet      : ölünce düşen eşyalar (sans: 0-1 arası ihtimal)
#
#  BOSS TÜRLERİ: her türün kendi isim havuzu vardır - isim, uzaktan
#  bakıldığında neyle karşı karşıya olduğunu söylemelidir. Boss öldüğünde
#  "kafa" alanındaki eşya, o bossun kendi ismiyle ve nadirlik rengiyle
#  yere düşer.
#
#  silah-turu: KILIC | BALTA | YAY | YOK
# =====================================================================

spawn-araligi-dakika: 30

# Boss'un, seçilen oyuncuya olan uzaklığı. Gidilmesi gereken kadar uzak,
# bir sonraki boss gelmeden varılabilecek kadar yakın.
oyuncuya-uzaklik:
  en-az: 120
  en-fazla: 320

