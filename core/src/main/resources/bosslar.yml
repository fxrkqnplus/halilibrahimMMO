    can-carpani: 16.0
    hasar-carpani: 3.2
    hiz-carpani: 1.3
    sinif-xp: 8000
    oyun-xp: 700
    zenginlik: 80000
    kacar: true
    isinlanir: true
    iksir-icer: true
    silahlar:
      KILIC: NETHERITE_SWORD
