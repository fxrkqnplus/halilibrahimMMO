# =====================================================================
#  HalilIbrahimMMO - Dünya Bossları
# =====================================================================
#  Belirli aralıklarla haritada, çevrimiçi bir oyuncunun birkaç yüz blok
#  uzağında bir dünya bossu belirir ve koordinatlarıyla birlikte tüm
#  sunucuya duyurulur. Boss, adı ve nadirliği olan, çok güçlendirilmiş
#  bir yaratıktır; sunucu yeniden başlasa bile ödülleriyle birlikte
#  yerinde kalır.
#
#  NADİRLİK: "agirlik" bir yüzde DEĞİL, bir paydır. Bir nadirliğin çıkma
#  ihtimali = kendi ağırlığı / bütün ağırlıkların toplamı. Yüzde yerine
#  ağırlık kullanılmasının sebebi basit: toplamı 100 etmeyen bir yüzde
#  listesi sessiz bir hatadır, ağırlık listesi ise her zaman geçerlidir.
#  Aşağıdaki 49/30/20/10/1 dağılımı istenen "sıradan çok, mistik neredeyse
#  hiç" oranını korur.
#
#  Her nadirlik şunları belirler:
#    can-carpani / hasar-carpani / hiz-carpani : temel yaratığın kaç katı
#    zeka         : bossun DAVRANIŞ seviyesi (aşağıya bakın)
#    silahlar     : hangi silah türü hangi eşyaya karşılık gelir
#    zirh         : sırasıyla kask, göğüslük, pantolon, bot (en fazla 4)
#    isinlanir    : savaş sırasında oyuncuya doğru kısa ışınlamalar yapar
#    sinif-xp     : öldüren oyuncunun sınıfına yazılan XP
#    oyun-xp      : yere düşen normal Minecraft tecrübesi
#    sayginlik    : öldüren oyuncuya yazılan Saygınlık Puanı
#    ganimet      : ölünce düşen eşyalar (sans: 0-1 arası ihtimal)
#
#  ----- ZEKA (Faz 23) -----
#  Bir bossun ne kadar akıllı olduğu TEK bir isimle söylenir; hangi
#  davranışın hangi seviyede açıldığı koddadır (BossIntelligence). Böylece
#  "kapı kıran ama çiti açamayan" gibi kimsenin istemediği bir bileşim
#  yapılandırmadan üretilemez. Merdiven her zaman tek yönlüdür: üst seviye,
#  alt seviyenin yaptığı her şeyi yapar.
#
#    SERSEM  : yalnızca dolaşır ve vurur. Çok güçlü sıradan bir yaratık.
#    UYANIK  : tırmanır, zıplar, tuzak kapısı/çit kapısı açar, başıboşken
#              çevredeki hayvanlara ve köylülere saldırır.
#    KURNAZ  : + mağaralara girmez, uçurum kenarına gitmez, önündeki kapıyı
#              kırar, elinde yay varsa kaçarak nişan alır, canı azalınca
#              kaçıp kendini toparlar ve geri döner.
#    USTA    : + köy basar. Önce demir golemi, sonra köylüleri hedef alır;
#              yolundaki kapıları kırar, tarlaları çiğner.
#    DEHA    : USTA ile aynı repertuvar, aşağıdaki sayılarla (daha hızlı
#              toparlanma, daha çok kaçış hakkı).
#
#  Yazılmazsa zeka nadirliğe göre türetilir (SIRADAN->SERSEM ...
#  MISTIK->DEHA), yani bu dosyanın eski bir sürümü de mantıklı davranır.
#
#  ----- KAÇMA VE TOPARLANMA -----
#    kacis-can-orani            : bu orana düşünce boss kaçmaya başlar
#    toparlanma-orani           : kaçtıktan sonra bu orana kadar iyileşir,
#                                 sonra geri döner. Bilerek 1.0 DEĞİLDİR:
#                                 tam dolarak dönen bir boss dövüşü hayatta
#                                 kalmış değil, silmiş olurdu.
#    can-yenileme-orani-saniyede: saniyede kendi maksimum canının kaçta kaçı.
#                                 0.01 = %1. Oran olmasının sebebi: sabit bir
#                                 sayı Mistik'te işe yaramaz, Sıradan'da anında
#                                 biterdi. Bilerek YAVAŞTIR - kaçış bir
#                                 nefeslenme olmalı, bir sıfırlama değil.
#    kacis-hakki                : ömrü boyunca kaç kere kaçabileceği. 0 =
#                                 durduğu yerde dövüşür.
#
#  NOT (Faz 23): iyileştirme artık YENİLENME İKSİRİ ile değil, doğrudan can
#  yazarak yapılıyor. Zombi/iskelet/boğulmuş yaratıklar undead oldukları için
#  Regeneration'dan hiç etkilenmiyorlardı; ekranda kalp efekti çıkıyor ama can
#  hiç dolmuyordu. Bildirilen hata tam olarak buydu.
#
#  BOSS TÜRLERİ: her türün kendi isim havuzu vardır - isim, uzaktan
#  bakıldığında neyle karşı karşıya olduğunu söylemelidir. Boss öldüğünde
#  "kafa" alanındaki eşya, o bossun kendi ismiyle, nadirlik rengiyle ve
#  ONU ÖLDÜREN OYUNCUNUN ADIYLA yere düşer.
#
#  silah-turu: KILIC | BALTA | YAY | YOK
#  hiz-seviyesi: bu türün kalıcı Hız büyüsü seviyesi (0 = yok, 2 = Hız 2).
#                Nadirliğin "hiz-carpani" değerinden ayrıdır: o, yaratığın
#                kendi yürüyüş hızını ölçekler; bu ise türün genel olarak
#                yavaş mı hızlı mı olduğunu söyler.
#
#  UYARI - YAY silahi neden her kademede BOW: bir iskelet yalnizca elinde
#  BOW varken vanilla'nin ok atma goal'una geciyor. ARBALET verildiginde
#  sessizce yumruk atma goal'una dusuyor ve "elinde arbalet var ama elle
#  vuruyor" hatasi tam olarak buydu. Ustune eklenti KURNAZ ve uzeri bosslara
#  kacarak nisan alma + agir bir isabet atisi ekliyor.
# =====================================================================

spawn-araligi-dakika: 30

# Boss'un, seçilen oyuncuya olan uzaklığı. Gidilmesi gereken kadar uzak,
# bir sonraki boss gelmeden varılabilecek kadar yakın.
oyuncuya-uzaklik:
  en-az: 120
  en-fazla: 320

