          - "<gray>kuşandığını bırakır ve çalışan etkisini sonlandırır.</gray>"
          - "<gray>Bekleme süreleri sıfırlanmaz - çıkarıp takmak bir</gray>"
          - "<gray>kısayol değildir.</gray>"
          - ""
          - "<gray>Alet yalnızca <white>başlatmak</white> için gerekir. Bir kez</gray>"
          - "<gray>çalıştıktan sonra eşya değiştirmen onu bozmaz.</gray>"
      - baslik: "<dark_red>Asil Kurt - dönüşüm</dark_red>"
