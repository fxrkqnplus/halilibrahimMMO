          - "<gray>sözü. <white>Yalnızca geceleri</white> çağrılır; gündüz denersen</gray>"
          - "<gray>ne enerji ne bekleme harcanır, sadece reddedilirsin.</gray>"
          - ""
          - "<gray>Açtığın anda tüm sunucu üç kez uluma duyar ve</gray>"
          - "<gray>bir dakika boyunca <white>bir kurt olursun</white> - herkes seni</gray>"
          - "<gray>öyle görür, çünkü model istemci mod'unda vardır.</gray>"
          - ""
          - "<white>Kazandıkların</white>"
          - "<gray>• Hız 2, Dayanıklılık 2, Güç 3, Zıplama 5</gray>"
          - "<gray>• <white>10 fazladan kalp</white> (canın da o kadar dolar)</gray>"
          - "<gray>• 20 bloğa kadar düşme hasarı almazsın</gray>"
          - "<gray>• Canavarlar seni göremez, kurtlar seninle avlanır</gray>"
          - "<gray>• Et düşüren avını yerinde yersin, açlığın dolar</gray>"
          - ""
          - "<white>Ödediklerin</white>"
          - "<gray>• Zırhın çıkar ve süre boyunca giyemezsin</gray>"
          - "<gray>• <red>Suya giremezsin</red> - canın gider</gray>"
          - "<gray>• Slotbarın gider, yerine Kurt Pençeleri gelir</gray>"
          - "<gray>• Bekleme süresi <white>10 dakika</white></gray>"
      - baslik: "<dark_red>Asil Kurt - pençeler ve güneş</dark_red>"
        simge: SUNFLOWER
        satirlar:
          - "<white>Kurt Pençeleri</white>"
          - "<gray>Dönüşürken slotbarındaki dokuz eşya güvenle saklanır ve</gray>"
          - "<gray>yerine pençeler gelir. Süre boyunca slot değiştiremez,</gray>"
          - "<gray>eşya bırakamaz, envanterine dokunamaz ve yerden bir</gray>"
          - "<gray>şey alamazsın. Süre bitince hepsi geri gelir -</gray>"
          - "<gray>sunucu çökse bile: kayıt oyuncunun kendi verisindedir.</gray>"
          - ""
          - "<white>Yere çakılma</white>"
          - "<gray>Havadayken <white>shift</white>'e basılı tut: kendini yere</gray>"
          - "<gray>fırlatırsın. İnişte bir sarsıntı olur, 6 blok</gray>"
          - "<gray>yarıçapındaki yaratıklar hasar alıp savrulur.</gray>"
          - "<gray>Merkeze ne kadar yakınsa o kadar sert vurur.</gray>"
          - "<gray>Oyunculara dokunmaz ve bu dalışın kendisi düşme</gray>"
          - "<gray>hasarı vermez.</gray>"
          - ""
          - "<white>Sabah olursa</white>"
          - "<gray>Ekranında <gold>GÜNEŞTEN KAÇ</gold> yazar ve canın azalmaya</gray>"
          - "<gray>başlar. Kabiliyet kendi saatiyle bitmez - <white>gökyüzü</white></gray>"
          - "<white>ışığı hiç ulaşmayan</white> <gray>bir yere (mağara, kapalı bir</gray>"
          - "<gray>oda) girip <white>5 saniye</white> beklemen gerekir. O zaman</gray>"
