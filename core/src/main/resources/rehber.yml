# =====================================================================
#  HalilIbrahimMMO - Oyun İçi Rehber (/yardım, /bilgi, /rehber)
# =====================================================================
#  Bu dosya rehberin BÜTÜN metnini taşır. İstediğiniz kadar kategori ve
#  konu ekleyebilir, sırayı değiştirebilir, hepsini kendi üslubunuzla
#  yeniden yazabilirsiniz - tek bir satır Java kodu değişmez.
#
#  YAPI
#    kategoriler.<id>            : ASCII, küçük harf, benzersiz kimlik
#      gorunen-ad                : rehberin ana ekranında görünen başlık
#      simge                     : o kategoriyi temsil eden Bukkit Material
#      ozet                      : ana ekranda başlığın altındaki tek satır
#      konular                   : o kategorinin sayfaları (en fazla 28)
#        - baslik                : sayfanın adı
#          simge                 : sayfanın eşya simgesi
#          satirlar              : gövde metni, HER SATIR AYRI BİR SATIRDIR
#
#  BİÇİMLENDİRME
#    Her satır MiniMessage ile yazılır: <gray>, <white>, <gold>, <bold>...
#    <simge:guc>, <simge:enerji> gibi sunucunun kendi ikonları da çalışır.
#
#  SATIR UZUNLUĞU: Bu dosyanın satırları OLDUĞU GİBİ çizilir - başka
#  ekranların aksine otomatik alt satıra kaydırma uygulanmaz, çünkü
#  sayfaların düzenini siz kuruyorsunuz. Bir satırı görünen 78 karakterin
#  altında tutun (MiniMessage etiketleri sayılmaz); daha uzunu istemcide
#  kesilir. Boş satır ("") paragraf arası bırakır.
# =====================================================================

kategoriler:

  # -------------------------------------------------------------------
  baslangic:
    gorunen-ad: "<green><bold>Başlangıç</bold></green>"
    simge: OAK_SAPLING
    ozet: "Sunucuya yeni geldiysen buradan başla."
    konular:
      - baslik: "<green>1. Adım - MMO'yu aç</green>"
        simge: NETHER_STAR
        satirlar:
          - "<gray>Sunucuya ilk girdiğinde MMO sistemi <white>kapalıdır</white>.</gray>"
          - "<gray>Açmak için <white>/mmo</white> yaz.</gray>"
          - ""
          - "<gray>Açılmadan önce hiçbir şey ilerlemez: beceri XP'si,</gray>"
          - "<gray>görev, saygınlık, hiçbiri. Bu kasıtlıdır - sisteme</gray>"
          - "<gray>girmeyi sen seçersin.</gray>"
      - baslik: "<green>2. Adım - Sınıfını seç</green>"
        simge: DIAMOND_SWORD
        satirlar:
          - "<gray>/mmo komutu seni doğrudan sınıf seçim ekranına götürür.</gray>"
          - "<gray>Üç sınıf vardır ve hepsinin oynanışı farklıdır.</gray>"
          - ""
          - "<yellow>Sınıfın en önemli kararın</yellow><gray>: hangi kabiliyetleri</gray>"
          - "<gray>açacağını ve hangi becerilerden ekstra XP alacağını</gray>"
          - "<gray>belirler. Değiştirmek 7 gün bekleme gerektirir.</gray>"
          - ""
          - "<gray>Ayrıntı için rehberin <white>Sınıflar</white> bölümüne bak.</gray>"
      - baslik: "<green>3. Adım - Oyna, panelini oku</green>"
        simge: OAK_SIGN
        satirlar:
          - "<gray>Ekranın sağındaki panel her şeyi anlatır: Güç'ün,</gray>"
          - "<gray>prestijin, saygınlığın, sınıfın, kuşandığın kabiliyet</gray>"
          - "<gray>ve takip ettiğin görevler.</gray>"
          - ""
          - "<gray>Panel iki saniyede bir kendini yeniler.</gray>"
          - "<gray><white>/panel</white> ile gizleyip gösterebilirsin.</gray>"
      - baslik: "<green>Başlangıç görevleri</green>"
        simge: MAP
        satirlar:
          - "<gray>Panelde <white>Başlangıç</white> başlığı altında dört küçük</gray>"
          - "<gray>görev görürsün. Hepsi tek seferliktir ve sana</gray>"
          - "<gray>sınıf XP'si kazandırır.</gray>"
          - ""
          - "<gray>Hepsini bitirince o bölüm panelden tamamen kaybolur.</gray>"

  # -------------------------------------------------------------------
  siniflar:
    gorunen-ad: "<red><bold>Sınıflar</bold></red>"
    simge: DIAMOND_SWORD
    ozet: "Üç sınıf, üç oynanış. Sınıfının mantığı."
    konular:
      - baslik: "<yellow>Sınıf ne işe yarar?</yellow>"
        simge: BOOK
        satirlar:
          - "<gray>Bir sınıf üç şeye birden karar verir:</gray>"
          - ""
          - "<white>1.</white> <gray>Hangi <white>kabiliyetleri</white> kullanabileceğine.</gray>"
          - "<white>2.</white> <gray>Hangi becerilerden <white>+%20 XP</white> alacağına.</gray>"
          - "<white>3.</white> <gray>Prestij yaptıkça biriken kalıcı bonusuna.</gray>"
          - ""
          - "<gray>Sınıfının beslendiği becerilere <white>sinerji becerisi</white></gray>"
          - "<gray>denir. O becerilerden kazandığın XP'nin bir kısmı</gray>"
          - "<gray>sınıfının kendi seviyesine de yazılır.</gray>"
      - baslik: "<red>Amansız Savaşçı</red>"
        simge: DIAMOND_SWORD
        satirlar:
          - "<gray>Sinerji becerisi: <white>Avcılık</white></gray>"
          - "<gray>Kalıcı prestij bonusu: <white>PvE hasarı</white></gray>"
          - ""
          - "<gray>Dar ama derin bir uzman. Yaratık öldürerek büyür,</gray>"
          - "<gray>kabiliyetlerinin hepsi dövüşle ilgilidir.</gray>"
          - ""
          - "<yellow>Kabiliyetleri kılıçla ya da baltayla çalışır.</yellow>"
          - ""
          - "<white>10</white> <gray>B Planı - 5 sn boyunca yaratıklar seni göremez</gray>"
          - "<white>20</white> <gray>Avcı Odağı - PvE hasarın %50 artar</gray>"
          - "<white>35</white> <gray>Yıkıcı Darbe - çevrene şok dalgası</gray>"
          - "<white>50</white> <gray>Kan Yemini - verdiğin hasar cana döner</gray>"
      - baslik: "<blue>Mağara Adamı</blue>"
        simge: DIAMOND_PICKAXE
        satirlar:
          - "<gray>Sinerji becerisi: <white>Madencilik</white></gray>"
          - "<gray>Kalıcı prestij bonusu: <white>maksimum enerji</white></gray>"
          - ""
          - "<gray>Yeraltının sahibi. Kabiliyetlerinin tamamı kaya</gray>"
          - "<gray>kaldırmak, cevher bulmak ve hızlı kazmak üzerine.</gray>"
          - ""
          - "<white>10</white> <gray>Bulldozer - kazdığın her blok 3x3x3 düşer</gray>"
          - "<white>20</white> <gray>Madenci Refleksleri - kazmana +3 Verimlilik</gray>"
          - "<white>35</white> <gray>Kaya Patlaması - Maden Bombası bırakır</gray>"
          - "<white>50</white> <gray>Maden Feneri - 36 blokta cevherler parlar</gray>"
      - baslik: "<green>Tabiat Vârisi</green>"
        simge: IRON_AXE
        satirlar:
          - "<gray>Sinerji becerileri: <white>Odunculuk, Kazıcılık,</white></gray>"
          - "<white>Tarımcılık, Hayvancılık</white>"
          - "<gray>Kalıcı prestij bonusu: <white>maksimum can</white></gray>"
          - ""
          - "<gray>Tek başına dört beceri besler. Her kabiliyeti bu dört</gray>"
          - "<gray>becerinin birine düşer, bu yüzden hiçbiri tek başına</gray>"
          - "<gray>belirleyici değildir - ama dördü birden çok yönlüdür.</gray>"
          - ""
          - "<white>10</white> <gray>Filiz Patlaması - ekinler dalga dalga olgunlaşır</gray>"
          - "<white>20</white> <gray>Sürü Çağrısı - sürü yemsiz çiftleşir</gray>"
          - "<white>35</white> <gray>Doğa Ana'nın Koruyucuları - hayvanlar savaşır</gray>"
          - "<white>50</white> <gray>Asil Kurt - geceleri kurda dönüşürsün</gray>"
      - baslik: "<yellow>Sınıf seviyesi</yellow>"
        simge: EXPERIENCE_BOTTLE
        satirlar:
          - "<gray>Beceri seviyenden ayrı, kendi XP çizgisi olan bir</gray>"
          - "<gray>ilerlemedir. Maksimum <white>50</white>'dir.</gray>"
          - ""
          - "<gray>Kabiliyetlerin <white>sınıf seviyesiyle</white> açılır:</gray>"
          - "<gray>10 → 20 → 35 → 50. Beceri seviyesiyle değil.</gray>"
          - ""
          - "<gray>Sınıf XP'si üç yerden gelir: sinerji becerilerinden,</gray>"
          - "<gray>görevlerden ve dünya bossu öldürmekten.</gray>"
      - baslik: "<yellow>Sınıf değiştirmek</yellow>"
        simge: CLOCK
        satirlar:
          - "<gray><white>/sınıf</white> ekranından değiştirilir.</gray>"
          - ""
          - "<red>Ayrıldığın sınıf tamamen sıfırlanır:</red>"
          - "<gray>• Sınıf seviyesi 1'e döner.</gray>"
          - "<gray>• O sınıfın odak ağacındaki bütün rankler silinir.</gray>"
          - ""
          - "<green>Karşılığında o rankler için harcadığın bütün özellik ve</green>"
          - "<green>kabiliyet puanları sana geri döner</green><gray>; yeni sınıfının</gray>"
          - "<gray>ağacına yeniden harcarsın.</gray>"
          - ""
          - "<gray>Bir daha değiştirmek için <white>7 gün</white> beklersin.</gray>"

  # -------------------------------------------------------------------
  beceriler:
    gorunen-ad: "<gold><bold>Beceriler</bold></gold>"
    simge: IRON_PICKAXE
    ozet: "Altı beceri, nasıl arttığı ve ne kazandırdığı."
    konular:
      - baslik: "<gold>Altı beceri</gold>"
        simge: EXPERIENCE_BOTTLE
        satirlar:
          - "<gray>Her biri 1-100 arası, birbirinden bağımsız seviyelenir.</gray>"
          - ""
          - "<white>Kazıcılık</white> <gray>- toprak, kum, çakıl, kil kazmak</gray>"
          - "<white>Odunculuk</white> <gray>- kütük kesmek</gray>"
          - "<white>Madencilik</white> <gray>- cevher kırmak</gray>"
          - "<white>Avcılık</white> <gray>- yaratık öldürmek</gray>"
          - "<white>Tarımcılık</white> <gray>- tarlada yapılan her iş</gray>"
          - "<white>Hayvancılık</white> <gray>- hayvanı yaşatmanın her adımı</gray>"
          - ""
          - "<gray>Her birinin kendi komutu var: <white>/madencilik</white> gibi.</gray>"
      - baslik: "<gold>Beceri XP'si nasıl kazanılır?</gold>"
        simge: DIAMOND_ORE
        satirlar:
          - "<gray>Her blok ve her yaratık <white>gerçek değerine göre</white></gray>"
          - "<gray>XP verir. Kömür 12, elmas 135, kadim kalıntı 300.</gray>"
          - "<gray>Bir inek 15, bir zombi 24, bir Warden 1800.</gray>"
          - ""
          - "<yellow>Tarımcılık ve hayvancılık farklıdır</yellow><gray>: blok kırmakla</gray>"
          - "<gray>değil <white>eylemle</white> artar - çapalamak, kemik tozu,</gray>"
          - "<gray>sağmak, kırpmak, çiftleştirmek, evcilleştirmek,</gray>"
          - "<gray>köylüyle ticaret, kayışla hayvan taşımak, pişirmek.</gray>"
          - ""
          - "<gray>Görevler de eğittikleri beceriye XP öder.</gray>"
      - baslik: "<red>XP vermeyen iki durum</red>"
        simge: BARRIER
        satirlar:
          - "<red>1. Yaratıcı ya da İzleyici mod.</red>"
          - "<gray>Hiçbir beceri, sınıf ya da görev ilerlemesi olmaz.</gray>"
          - ""
          - "<red>2. Oyuncunun koyduğu bloklar.</red>"
          - "<gray>Yere koyduğun bir cevheri kırmak hiçbir şey vermez.</gray>"
          - "<gray>Blok kayıtları chunk'ın kendi verisinde saklanır ve</gray>"
          - "<gray>sunucu yeniden başlasa bile unutulmaz.</gray>"
          - ""
          - "<gray>Tek istisna <white>ekinlerdir</white>: kendi ektiğin buğday da</gray>"
          - "<gray>tam olgunlaştığında XP verir. Olmamış ekin vermez.</gray>"
      - baslik: "<gold>Kilometre taşları</gold>"
        simge: GOLDEN_APPLE
        satirlar:
          - "<gray>Her beceri <white>25 / 50 / 75 / 100</white>. seviyede kalıcı</gray>"
          - "<gray>bir bonus açar. Zayıftan güçlüye sıralanmıştır.</gray>"
          - ""
          - "<gray>Her beceri <white>kendi işine yarayan</white> bir şey verir:</gray>"
          - "<gray>• Kazıcılık: çift düşme, enerji, geniş kazı</gray>"
          - "<gray>• Odunculuk: ağaç devirme, çift düşme</gray>"
          - "<gray>• Madencilik: çift düşme, Acele I ve II</gray>"
          - "<gray>• Avcılık: ekstra kalp ve PvE hasarı</gray>"
          - "<gray>• Tarımcılık: çift düşme, otomatik ekim</gray>"
          - "<gray>• Hayvancılık: yem iadesi, ikiz doğum</gray>"
          - ""
          - "<gray>Bonuslar <white>ölünce kaybolmaz</white>, yeniden doğunca geri</gray>"
          - "<gray>gelir. Yalnızca prestij onları sıfırlar.</gray>"
      - baslik: "<gold>Güç nedir?</gold>"
        simge: NETHERITE_INGOT
        satirlar:
          - "<gray>Güç'ün kendi XP kaynağı <white>yoktur</white>. Altı becerinin</gray>"
          - "<gray>seviyelerinin toplamıdır.</gray>"
          - ""
          - "<gray>Buna prestij yaptıkça <white>biriken</white> Güç eklenir, bu</gray>"
          - "<gray>yüzden prestij Güç'ünü asla düşürmez.</gray>"
          - ""
          - "<gray>Güç 25/50/75/100'e ulaştığında sunucuya duyurulur.</gray>"

  # -------------------------------------------------------------------
  kabiliyetler:
    gorunen-ad: "<light_purple><bold>Kabiliyetler</bold></light_purple>"
    simge: BLAZE_POWDER
    ozet: "Nasıl kuşanılır, nasıl çalıştırılır, ne yaparlar."
    konular:
      - baslik: "<light_purple>Nasıl kullanılır?</light_purple>"
        simge: BLAZE_POWDER
        satirlar:
          - "<white>1.</white> <gray><white>/kabiliyet</white> menüsünden birini <white>kuşan</white>.</gray>"
          - "<white>2.</white> <gray>Kabiliyetin istediği aleti eline al.</gray>"
          - "<white>3.</white> <gray><white>Çift sağ tıkla</white> - ilk tık uyarır, ikincisi çalıştırır.</gray>"
          - ""
          - "<gray>Bloğa, boş havaya ya da bir yaratığa tıklamak - üçü de</gray>"
          - "<gray>çalışır. Onay için 3 saniyen var.</gray>"
          - ""
          - "<gray>Tek tıkla çalışmamasının sebebi basit: kabiliyetler</gray>"
          - "<gray>enerji harcar ve uzun bekleme süreleri başlatır.</gray>"
      - baslik: "<light_purple>Kabiliyet açılma seviyeleri</light_purple>"
        simge: EXPERIENCE_BOTTLE
        satirlar:
          - "<gray>Her sınıfın <white>tam olarak dört</white> kabiliyeti vardır ve</gray>"
          - "<gray>hepsi aynı basamaklarda açılır:</gray>"
          - ""
          - "<white>Sınıf seviyesi 10 → 20 → 35 → 50</white>"
          - ""
          - "<gray>Basamak yükseldikçe kabiliyet güçlenir ve bekleme</gray>"
          - "<gray>süresi uzar. <white>50. seviyedeki kabiliyet sınıfın son</white></gray>"
          - "<white>sözüdür</white><gray>: en güçlü etki, en uzun bekleme.</gray>"
      - baslik: "<yellow>Kabiliyeti tetiklemeyen tıklamalar</yellow>"
        simge: OAK_DOOR
        satirlar:
          - "<gray>Kendi işi olan bloklar kabiliyeti açmaz: kapı, sandık,</gray>"
          - "<gray>fırın, örs, tabela, yatak, düğme, şalter...</gray>"
          - "<gray>Gerçekten orada kullanmak istiyorsan <white>shift + sağ tık</white>.</gray>"
          - ""
          - "<gray>Elinde blok, kova, kayık, kayış gibi kendi işlevi olan</gray>"
          - "<gray>bir eşya varken bir bloğa tıklamak da açmaz - orada</gray>"
          - "<gray>shift kaçış yolu <white>değildir</white>. Boş havaya tıkla.</gray>"
      - baslik: "<light_purple>Kuşanma ve çıkarma</light_purple>"
        simge: SHEARS
        satirlar:
          - "<gray>Farklı bir kabiliyete geçmek <white>2 dakika</white> bekleme</gray>"
          - "<gray>gerektirir; aynısını yeniden seçmek serbesttir.</gray>"
          - ""
