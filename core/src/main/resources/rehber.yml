  # -------------------------------------------------------------------
  enerji:
    gorunen-ad: "<aqua><bold>Enerji</bold></aqua>"
    simge: GLOWSTONE_DUST
    ozet: "Kabiliyetlerin yakıtı ve üç kuralı."
    konular:
      - baslik: "<aqua>Üç kural</aqua>"
        simge: GLOWSTONE_DUST
        satirlar:
          - "<white>1.</white> <gray>Enerjiyi <white>yalnızca kabiliyetler</white> harcar.</gray>"
          - "<gray>   Koşmak, savaşmak, blok kırmak enerjiye dokunmaz.</gray>"
          - ""
          - "<white>2.</white> <gray>Bir kabiliyet açıkken enerji <white>hiç yenilenmez</white>.</gray>"
          - "<gray>   Kabiliyet bitince saniyede 3 puan dolmaya başlar.</gray>"
          - ""
          - "<white>3.</white> <gray>Süpürme kabiliyetleri <white>blok başına</white> öder.</gray>"
          - "<gray>   Enerjin biterse kabiliyet orada durur.</gray>"
      - baslik: "<aqua>Blok başına maliyetler</aqua>"
        simge: IRON_PICKAXE
        satirlar:
          - "<white>Bulldozer</white>   <gray>kazılan her blok için <white>3</white> enerji</gray>"
