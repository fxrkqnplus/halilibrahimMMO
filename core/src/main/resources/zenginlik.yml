# =====================================================================
#  HalilIbrahimMMO - Zenginlik Puanı Ayarları
# =====================================================================
#  Zenginlik Puanı herkeste 0 olarak başlar ve yalnızca ARTAR - hiçbir
#  şekilde harcanmaz, takas edilmez, bir şey satın almaz. Bu bir para
#  birimi DEĞİLDİR; bu sunucuda ekonomi yoktur. Puan, oyuncunun dünyadan
#  gerçekte ne çıkardığının bir ölçüsüdür: liderlik tablosundaki yerini,
#  hangi ünvan ve kozmetikleri açtığını ve hangi anların tüm sunucuya
#  duyurulacağını belirler.
#
#  Her kaynak tasarım gereği tek seferliktir; çiftlik kurup tekrar tekrar
#  kazanılamaz:
#    - bloklar   : yalnızca DÜNYANIN kendi oluşturduğu bloklar sayılır.
#                  Oyuncunun kendi koyduğu bir blok hiçbir puan vermez.
#    - varliklar : bir yaratığı öldürmek. Listelenmeyen her yaratık
#                  "varsayilan-varlik" kadar verir (bilerek en düşük
#                  değerdir, çünkü listelenmeyenler genelde çiftlik
#                  hayvanlarıdır).
#    - gorevler  : bir görevi TAMAMLAMAK. Değerli bir yeri keşfetmenin
#                  karşılığı buradan gelir - keşif görevleri bir kez
#                  tamamlanır ve bir daha tamamlanamaz.
#    - dünya bossları ayrıca kendi nadirliğine göre puan verir (bkz.
#      bosslar.yml).
#
#  kilometre-taslari: bu eşiklerin her biri bir kez geçilir; geçildiğinde
#  hem oyuncunun kendisine bir mesaj gider hem de tüm sunucuya duyurulur.
#  Bir ödül aynı anda birkaç eşiği birden geçerse yalnızca en yükseği
#  duyurulur.
#
#  siralama-duyuru-araligi-dakika: zenginlik liderlik tablosunun ne sıklıkla
#  yeniden okunup sıralama değişikliklerinin sohbete duyurulacağı. Her duyuru
#  TÜM SUNUCUYA gider; kısa bir aralık tabloyu kimsenin susturamayacağı bir
#  spikere çevirir, o yüzden 20-30 dakika arası önerilir. Her turda yalnızca
#  en dikkat çekici tek bir değişiklik duyurulur.
# =====================================================================

varsayilan-varlik: 25
varsayilan-gorev: 2500

kilometre-taslari: [10000, 50000, 250000, 1000000, 5000000, 25000000, 100000000]

siralama-duyuru-araligi-dakika: 25

