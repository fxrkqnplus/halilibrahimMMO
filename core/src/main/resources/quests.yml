# =====================================================================
#  HalilIbrahimMMO - Görev Ayarları
# =====================================================================
#  tur: PERMANENT (kalıcı, tek seferlik) | DAILY (günlük) | WEEKLY (haftalık)
#
#  hedef.tur değerleri:
#    BLOCK_BREAK        : blok kırma      -> hedef.malzemeler listesi zorunlu
#    MOB_KILL           : yaratık öldürme -> hedef.varliklar (boş = her yaratık)
#    STRUCTURE_DISCOVER : yapı bulma      -> hedef.yapilar listesi zorunlu
#    ITEM_OBTAIN        : eşya edinme     -> hedef.esyalar listesi zorunlu
#    DEED               : belirli bir iş  -> hedef.eylem zorunlu
#
#  hedef.eylem (DEED) değerleri - her biri gerçek bir olaya bağlıdır:
#    ghast-alev-topu : bir ghast'ı kendi ateş topuyla öldürmek
#    piglin-takasi   : bir piglin'e altın vererek takas yapmak
#    koylu-takasi    : köylü ya da gezgin tüccarla ticaret yapmak
#    buyuleme        : büyü masasında bir eşya büyülemek
#    balik-tutma     : oltayla balık çıkarmak
#    evcillestirme   : herhangi bir hayvanı evcilleştirmek
#    ciftlestirme    : iki hayvanı çiftleştirip yavru elde etmek
#    koyun-kirpma    : bir koyunu makasla kırpmak
#    gezgin-tuccar   : haritada dolaşan gezgin tüccarı bulup sağ tıklamak
#    maden-sandigi   : DÜNYANIN kendi oluşturduğu bir raylı sandığı açmak
#                      (oyuncunun koyduğu vagonun ganimet tablosu olmadığı için
#                       sayılmaz - görev evde kurulamaz)
#
#  hedef.boyut (isteğe bağlı): NORMAL | NETHER | THE_END. Yazılırsa görev
#  yalnızca o boyutta ilerler - "End'de 100 enderman öldür" gibi hedefler
#  bunun sayesinde gerçekten End'i şart koşar.
#
#  hedef.yapilar için geçerli adlar (Minecraft yapı adları, küçük harf):
#    village_plains village_desert village_savanna village_snowy village_taiga
#    buried_treasure shipwreck shipwreck_beached mineshaft mineshaft_mesa
#    stronghold monument mansion ancient_city trial_chambers trail_ruins
#    fortress bastion_remnant nether_fossil end_city pillager_outpost
#    desert_pyramid jungle_pyramid igloo swamp_hut ocean_ruin_cold
#    ocean_ruin_warm ruined_portal (ve ruined_portal_* çeşitleri)
#  Yapı görevleri, oyuncu o yapının içinde durduğu anda ilerler. Bu tür
#  BİLEREK azdır: bir yere varmak tek başına görev sayılmaz, neredeyse her
#  keşif görevi oraya vardıktan sonra yapılacak bir iş ister.
#
#  ITEM_OBTAIN görevleri hem yerden eşya alındığında hem de bir sandıktan
#  eşya çıkarıldığında ilerler.
#
#  beceri : Görev tamamlandığında XP'nin yazılacağı beceri. Bu XP normal
#           beceri XP'siyle aynı yoldan verilir; dolayısıyla oyuncunun sınıfı
#           o beceriden sinerji alıyorsa sınıf seviyesine de yansır. Örneğin
#           bir zombi görevi herkese avcılık XP'si verir, Amansız Savaşçı
#           oynayan birine ayrıca Amansız Savaşçı XP'si de kazandırır.
#           Sınıfı o beceriden beslenmeyen oyuncular sınıf XP'sini yine alır.
#
#  gorunen-ad: /görev menüsünde görünen tam ad.
#  kisa-ad   : SAĞDAKİ PANELDE görünen kısa ad. Bir emir cümlesi olarak yazın:
#              "40 kütük kır", "8 enderman öldür", "Bir köy keşfet" gibi - ne
#              yapılacağı panelden tek bakışta anlaşılsın. Panel satırları
#              kaydırmaz, keser; en fazla 24 karakter kullanın.
#  aciklama  : görev menüsünde görevin üstüne gelindiğinde okunan açıklama.
#  simge     : görev menüsündeki eşya simgesi (herhangi bir Bukkit Material adı).
#
#  DAILY/WEEKLY görevler bir havuzdan rastgele seçilir: her oyuncuya her
#  gün/hafta bu havuzdan gunluk-atanan-sayisi/haftalik-atanan-sayisi kadar
#  görev atanır (PERMANENT görevler havuzlanmaz, herkese her zaman atanmıştır).
#
#  SABİTLEME: /görev ekranında bir göreve tıklayarak onu sağdaki panele
#  sabitleyebilirsin (bölüm başına en fazla 3). Kalıcı görevler panelde
#  YALNIZCA sabitlenirlerse görünür - onlarcası var, hepsi sığmaz.
#
#  ÖNEMLİ: Oyuncunun kendi koyduğu bloklar hiçbir görevde sayılmaz; yalnızca
#  dünyanın kendi oluşturduğu bloklar ilerleme kazandırır.
#
#  Bu dosyayı /haliladmin panelindeki "Yeniden Yükle" düğmesiyle yükleyin.
# =====================================================================

