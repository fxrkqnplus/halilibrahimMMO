# =====================================================================
#  HalilIbrahimMMO - Görev Ayarları
# =====================================================================
#  tur: PERMANENT (kalıcı, tek seferlik) | DAILY (günlük) | WEEKLY (haftalık)
#  hedef.tur: BLOCK_BREAK (blok kırma) | MOB_KILL (yaratık öldürme)
#  hedef.malzemeler sadece BLOCK_BREAK, hedef.varliklar sadece MOB_KILL için
#  kullanılır. varliklar boş bırakılırsa herhangi bir yaratık sayılır.
#
#  aciklama: görev menüsünde görevin üstüne gelindiğinde okunan açıklama.
#  simge   : görev menüsündeki eşya simgesi (herhangi bir Bukkit Material adı).
#
#  DAILY/WEEKLY görevler bir havuzdan rastgele seçilir: her oyuncuya her
#  gün/hafta bu havuzdan gunluk-atanan-sayisi/haftalik-atanan-sayisi kadar
#  görev atanır (PERMANENT görevler havuzlanmaz, herkese her zaman atanmıştır).
#
#  ÖNEMLİ: Oyuncunun kendi koyduğu bloklar hiçbir görevde sayılmaz; yalnızca
#  dünyanın kendi oluşturduğu bloklar ilerleme kazandırır.
#
#  Bu dosyayı /haliladmin panelindeki "Yeniden Yükle" düğmesiyle yükleyin.
# =====================================================================

gunluk-atanan-sayisi: 3
haftalik-atanan-sayisi: 2

gorevler:
  odun-ustasi:
    gorunen-ad: "Odun Ustası"
    aciklama: "Ormanlarda 500 kütük kes. Hangi ağaç türü olduğu fark etmez."
    simge: OAK_LOG
    tur: PERMANENT
    hedef:
      tur: BLOCK_BREAK
      malzemeler: [OAK_LOG, SPRUCE_LOG, BIRCH_LOG, JUNGLE_LOG, ACACIA_LOG, DARK_OAK_LOG]
    sayi: 500
    xp: 3000

  derinlik-kazicisi:
    gorunen-ad: "Derinlik Kazıcısı"
    aciklama: "Dünyanın en derin katmanlarından 50 nadir cevher çıkar: elmas, zümrüt ya da antik döküntü."
    simge: DIAMOND_PICKAXE
    tur: PERMANENT
    hedef:
      tur: BLOCK_BREAK
      malzemeler: [DEEPSLATE_DIAMOND_ORE, DEEPSLATE_EMERALD_ORE, ANCIENT_DEBRIS]
    sayi: 50
    xp: 6000

  # ----- Gunluk havuz -----
