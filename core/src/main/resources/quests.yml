# =====================================================================
#  HalilIbrahimMMO - Görev Ayarları
# =====================================================================
#  tur: PERMANENT (kalıcı, tek seferlik) | DAILY (günlük) | WEEKLY (haftalık)
#  hedef.tur: BLOCK_BREAK (blok kırma) | MOB_KILL (yaratık öldürme)
#  hedef.malzemeler sadece BLOCK_BREAK, hedef.varliklar sadece MOB_KILL için
#  kullanılır. varliklar boş bırakılırsa herhangi bir yaratık sayılır.
#
#  DAILY/WEEKLY görevler artık bir havuzdan rastgele seçilir: her oyuncuya
#  her gün/hafta bu havuzdan gunluk-atanan-sayisi/haftalik-atanan-sayisi kadar
#  görev atanır (PERMANENT görevler havuzlanmaz, herkese her zaman atanmıştır).
#  Bu dosyayı /haliladmin panelindeki "Yeniden Yükle" düğmesiyle yükleyin.
# =====================================================================

gunluk-atanan-sayisi: 3
haftalik-atanan-sayisi: 2

