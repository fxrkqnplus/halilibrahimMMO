# =====================================================================
#  HalilIbrahimMMO - Koleksiyon Ayarları
# =====================================================================
#  Her koleksiyon, oyuncunun en az bir kez toplaması gereken eşyalardan
#  oluşur. Bir eşya ilk kez alındığında o ögenin "xp" değeri verilir;
#  koleksiyondaki tüm ögeler toplandığında ayrıca "tamamlama-xp" verilir.
#  Bu dosyayı /haliladmin panelindeki "Yeniden Yükle" düğmesiyle yükleyin.
# =====================================================================

koleksiyonlar:
  degerli-madenler:
    gorunen-ad: "Değerli Madenler"
    tamamlama-xp: 6000
    ogeler:
      elmas: { gorunen-ad: "Elmas", esya: DIAMOND, xp: 600 }
      zumrut: { gorunen-ad: "Zümrüt", esya: EMERALD, xp: 600 }
      altin: { gorunen-ad: "Altın Külçe", esya: GOLD_INGOT, xp: 300 }
      demir: { gorunen-ad: "Demir Külçe", esya: IRON_INGOT, xp: 150 }
      lapis: { gorunen-ad: "Lapis Lazuli", esya: LAPIS_LAZULI, xp: 150 }
      antika-kalinti: { gorunen-ad: "Antika Kalıntı", esya: ANCIENT_DEBRIS, xp: 1200 }

  deniz-hazineleri:
    gorunen-ad: "Deniz Hazineleri"
    tamamlama-xp: 3000
    ogeler:
      nautilus: { gorunen-ad: "Nautilus Kabuğu", esya: NAUTILUS_SHELL, xp: 450 }
      mercan: { gorunen-ad: "Mercan Bloğu", esya: BRAIN_CORAL_BLOCK, xp: 240 }
      deniz-feneri: { gorunen-ad: "Deniz Feneri", esya: SEA_LANTERN, xp: 360 }
      prizmarin: { gorunen-ad: "Prizmarin Kristali", esya: PRISMARINE_CRYSTALS, xp: 300 }
