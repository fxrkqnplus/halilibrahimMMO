# =====================================================================
#  HalilIbrahimMMO - Koleksiyon Ayarları
# =====================================================================
#  Her koleksiyon, oyuncunun en az bir kez toplaması gereken eşyalardan
#  oluşur. Bir eşya ilk kez alındığında o ögenin "xp" değeri verilir;
#  koleksiyondaki tüm ögeler toplandığında ayrıca "tamamlama-xp" verilir.
#  Bu dosyayı /haliladmin panelindeki "Yeniden Yükle" düğmesiyle yükleyin.
# =====================================================================

koleksiyonlar:
  degerli-madenler:
    gorunen-ad: "Değerli Madenler"
    tamamlama-xp: 2000
    ogeler:
      elmas: { gorunen-ad: "Elmas", esya: DIAMOND, xp: 200 }
      zumrut: { gorunen-ad: "Zümrüt", esya: EMERALD, xp: 200 }
      altin: { gorunen-ad: "Altın Külçe", esya: GOLD_INGOT, xp: 100 }
      demir: { gorunen-ad: "Demir Külçe", esya: IRON_INGOT, xp: 50 }
      lapis: { gorunen-ad: "Lapis Lazuli", esya: LAPIS_LAZULI, xp: 50 }
      antika-kalinti: { gorunen-ad: "Antika Kalıntı", esya: ANCIENT_DEBRIS, xp: 400 }

  deniz-hazineleri:
    gorunen-ad: "Deniz Hazineleri"
    tamamlama-xp: 1000
    ogeler:
      nautilus: { gorunen-ad: "Nautilus Kabuğu", esya: NAUTILUS_SHELL, xp: 150 }
      mercan: { gorunen-ad: "Mercan Bloğu", esya: BRAIN_CORAL_BLOCK, xp: 80 }
      deniz-feneri: { gorunen-ad: "Deniz Feneri", esya: SEA_LANTERN, xp: 120 }
      prizmarin: { gorunen-ad: "Prizmarin Kristali", esya: PRISMARINE_CRYSTALS, xp: 100 }
