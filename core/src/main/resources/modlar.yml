# ==========================================================================
#  HalilIbrahimMMO - Zorunlu Fabric mod doğrulaması
# ==========================================================================
#  Sunucuya giren her oyuncunun Fabric kullandığını ve aşağıdaki zorunlu
#  modların tamamını kurduğunu kontrol eder. Oyuncu bunların dışında
#  istediği kadar ekstra mod kullanabilir; yalnızca "yasakli-modlar"
#  listesindekiler engellenir.
#
#  ÖNEMLİ - bu bir hile koruması DEĞİLDİR. Kontrol, oyuncunun istemcisinde
#  çalışan eşlik mod'unun (hmmo-client) bildirdiği listeye dayanır;
#  değiştirilmiş bir istemci yalan söyleyebilir. Amacı, yanlış modpack
#  kuran iyi niyetli oyuncuyu bozuk bir oyun deneyiminden korumaktır.
# ==========================================================================

dogrulama:
  # Kapatılırsa hiçbir kontrol yapılmaz, hiçbir oyuncu atılmaz.
  # Geliştirme/bakım sırasında bunu false yapın.
  etkin: true

  # İstemcinin mod listesini göndermesi için tanınan süre. Bu süre içinde
  # cevap gelmezse oyuncu "eşlik mod'u yok" gerekçesiyle atılır.
  zaman-asimi-saniye: 10

  # İstemci markasını (client brand) kontrol eder. Fabric olmayan bir
  # istemci mod listesi beklemeden anında atılır.
  brand-kontrolu: true

  # Marka bilgisi girişten hemen sonra gelmez; bu kadar tik beklenir.
  brand-gecikme-tik: 20

  # İstemcinin bildirebileceği azami mod sayısı. Fabric API tek başına
  # ~100 alt modül olarak göründüğü için tipik bir oyuncu 150-200 mod
  # bildirir; bu değeri düşürmeyin.
  azami-mod-sayisi: 512

  # Bu izne sahip oyuncular doğrulamadan tamamen muaftır.
  # Kendinize vermeyi unutmayın, yoksa siz de giremezsiniz.
  bypass-izni: "hmmo.mod.bypass"

# --------------------------------------------------------------------------
#  ZORUNLU MODLAR
# --------------------------------------------------------------------------
#  id            : Mod'un fabric.mod.json içindeki kendi kimliği. Jar dosya
#                  adı DEĞİLDİR. Yanlış bir id, doğru modpack'i kurmuş TÜM
#                  oyuncuların atılmasına yol açar.
#  gorunen-ad    : Oyuncuya gösterilecek ad (atma mesajında görünür).
#  minimum-versiyon : ALT SINIRDIR. Oyuncu daha yeni sürüm kurabilir,
#                  yalnızca daha eskisi reddedilir.
#
#  Bu listeyi elle yazmayın: modpack güncellendiğinde
#  tools/mod-listesi-cikar.ps1 script'ini çalıştırıp çıktısını buraya
#  kopyalayın. Script her jar'ın kendi fabric.mod.json'unu okur.
# --------------------------------------------------------------------------
zorunlu-modlar:
  # Fabric Loader mods klasöründe bir jar olarak yer almaz, bu yüzden
  # script onu bulamaz; elle eklenmiştir. Sürümü sabitlenmiyor.
  - id: "fabricloader"
    gorunen-ad: "Fabric Loader"
    minimum-versiyon: "0.17.0"

  # Sunucunun mod doğrulamasını yapan eşlik mod'u. Bu mod olmadan hiçbir
  # oyuncu doğrulamayı geçemez.
  - id: "hmmo-client"
    gorunen-ad: "HalilIbrahimMMO İstemci Mod'u"
    # Mod sürümü: 1.1.0 (Faz 22, kabiliyet HUD'u) -> 1.2.0 (Faz 23, HUD
    # protokolü 2) -> 1.3.0 (Faz 24, protokol 3 ve kurt adam katmanı) ->
    # 1.4.0 (Faz 25: kurt adam modelinin yeniden yazımı ve animasyonları,
    # parlamanın gerçekten çalışması, Kurt Pençeleri modeli).
    #
    # FAZ 25'TE PROTOKOL DEĞİŞMEDİ - hâlâ 3. Yani 1.3.0 istemcisi bu sunucuda
    # eksiksiz çalışır; 1.4.0 yalnızca daha iyi görünür.
    #
    # Minimum yine BİLEREK 1.0.0'da bırakıldı. Minimum, yeni sürüm oyuncuların
    # kurulumuna ULAŞTIKTAN SONRA yükseltilir; önce yükseltmek, mod'u
    # güncelleyememiş dürüst oyuncuları kapıda bırakır.
    #
    # Eski bir istemci tanımadığı paketi SESSİZCE yok sayar: oyun aynı, yalnızca
    # ekran sade kalır. HUD, bu sunucuda yokluğuna izin verilen tek şeydir -
    # hiçbir oyun kuralı ona bağlı değildir.
    minimum-versiyon: "1.0.0"

  - id: "appleskin"
    gorunen-ad: "AppleSkin"
    minimum-versiyon: "3.0.10+mc26.2"
  - id: "architectury"
    gorunen-ad: "Architectury"
    minimum-versiyon: "21.0.4"
