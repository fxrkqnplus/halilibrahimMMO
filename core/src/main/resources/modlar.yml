    minimum-versiyon: "3.2.0-b"
  - id: "entityculling"
    gorunen-ad: "EntityCulling"
    minimum-versiyon: "1.10.5"
  - id: "fabric-api"
    gorunen-ad: "Fabric API"
    minimum-versiyon: "0.154.2+26.2"
  - id: "fabric-language-kotlin"
    gorunen-ad: "Fabric Language Kotlin"
    minimum-versiyon: "1.13.12+kotlin.2.4.0"
  - id: "ferritecore"
    gorunen-ad: "FerriteCore"
