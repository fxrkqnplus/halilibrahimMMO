# HalilIbrahimMMO - Sinif ve yetenek agaci ayarlari
# Degerleri degistirebilir, yeni sinif/dal ekleyebilirsiniz. ID'ler ASCII kalmalidir.
sinif-degistirme-bekleme-gun: 7

# YETENEK PUANLARI IKI AYRI HAVUZDUR ve birbirinin yerine harcanamaz:
#   OZELLIK  puani  -> kalici karakter istatistikleri (can, PvE hasar, enerji)
#   KABILIYET puani -> tek bir kabiliyete ozel iyilestirmeler (enerji maliyeti,
#                      bekleme suresi, etki siniri, etki suresi, etki gucu)
# Bir yetenegin hangi havuzdan odendigi "etki.tur" degerinden belirlenir, ayrica
# yazilmaz - kabiliyete ozel her tur zaten bir "kabiliyet" alani ister, digerleri
# istemez. Kabiliyet puani bilerek daha nadirdir.
yetenek-puani:
  ozellik-seviye-basina: 25
  kabiliyet-seviye-basina: 40
  prestij-basina-ozellik: 4
  prestij-basina-kabiliyet: 2

# Sinif seviyesi: sadece secili sinifin "sinerji-beceriler" listesindeki
# becerilerden XP kazanildikca artar. Bir sinif birden fazla beceriyi
# besleyebilir (Tabiat Varisi dordunu birden besler). Bu tamamen gorsel/prestij
# amacli bir ilerleme cizgisi degildir: kabiliyetlerin acilmasi buna baglidir.
sinif-ilerleme:
  maksimum-seviye: 50
  sinerji-xp-bonusu: 0.20
  seviyeler:
    1: 100
    2: 150
    3: 200
    4: 250
    5: 300
    6: 350
    7: 400
    8: 450
    9: 500
    10: 550
    11: 600
    12: 650
    13: 700
    14: 750
    15: 800
    16: 850
    17: 900
    18: 950
    19: 1000
    20: 1050
    21: 1100
    22: 1150
    23: 1200
    24: 1250
    25: 1300
    26: 1350
    27: 1400
    28: 1450
    29: 1500
    30: 1550
    31: 1600
    32: 1650
    33: 1700
    34: 1750
    35: 1800
    36: 1850
    37: 1900
    38: 1950
    39: 2000
    40: 2050
    41: 2100
    42: 2150
    43: 2200
    44: 2250
    45: 2300
    46: 2350
    47: 2400
    48: 2450
    49: 2500
    50: 0

# prestij-etkisi: her prestij rankinda kalici olarak eklenen, secili sinif icin
# gecerli bonus (MAX_HEALTH/PVE_DAMAGE_MULTIPLIER/MAX_ENERGY turlerinden biri).
#
# cerceve: o sinifa ait ekranlarin (kabiliyet listesi, yetenek agaci, beceri
#          detayi) kenarlarini cerceveleyen cam panel - sinifin bossbar rengiyle
#          ayni renkte olmasi tavsiye edilir.
# prestij-sinerji-seviyesi: prestij yapabilmek icin bu sinifin sinerji
#          becerilerinin HER BIRININ ulasmasi gereken seviye. Yazilmazsa
#          skills.yml'deki maksimum seviye (100) kullanilir. Bir beceri besleyen
#          siniftan o beceriyi 100'e cikarmasini istemek adil; ama Tabiat Varisi
#          dort beceri besliyor - dordunu birden 100 yapmasini beklemek onu
#          digerlerinden kat kat zor hale getiriyordu, bu yuzden 30 istenir.
# simge: sinif secim ekranlarinda bu sinifi temsil eden esya. Her sinif kendi
# temasina uygun bir esya kullanir; gecerli bir Bukkit Material adi olmalidir.
# Her sinifin yetenek agacinda hem OZELLIK hem KABILIYET yetenekleri vardir;
# ikisi ayri puan havuzundan odenir (bkz. yetenek-puani).
siniflar:
  avci:
    gorunen-ad: "Amansız Savaşçı"
    sinerji-beceriler: [avcilik]
    bossbar-rengi: KIRMIZI
    simge: DIAMOND_SWORD
    cerceve: RED_STAINED_GLASS_PANE
    prestij-etkisi: { tur: PVE_DAMAGE_MULTIPLIER, deger-basina: 0.02 }
    yetenekler:
      # --- Özellik yetenekleri ---
      nisancilik: { gorunen-ad: "Nişancılık", maksimum-rank: 4, etki: { tur: PVE_DAMAGE_MULTIPLIER, deger-rank-basina: 0.03 } }
      savas-canliligi: { gorunen-ad: "Savaş Canlılığı", maksimum-rank: 4, etki: { tur: MAX_HEALTH, deger-rank-basina: 2 } }
      savas-dayanikliligi: { gorunen-ad: "Savaş Dayanıklılığı", maksimum-rank: 4, etki: { tur: MAX_ENERGY, deger-rank-basina: 5 } }
      # --- Kabiliyet yetenekleri ---
      # ORANLAR MUTLAK DEGER ICIN SECILMISTIR. Her oran, kabiliyetin abilities.yml'deki
      # KENDI temel degerine gore hesaplanir; asagidaki yorumlar rank basina dusen
      # mutlak degisimi soyler. Temel degeri degistirirseniz oranlari da guncelleyin.
      odak-tasarrufu: { gorunen-ad: "Odak Tasarrufu", maksimum-rank: 4, etki: { tur: ABILITY_ENERGY_COST_REDUCTION, kabiliyet: avci-odagi, deger-rank-basina: 0.05 } }
      odak-ritmi: { gorunen-ad: "Odak Ritmi", maksimum-rank: 4, etki: { tur: ABILITY_COOLDOWN_REDUCTION, kabiliyet: avci-odagi, deger-rank-basina: 0.05 } }
      odak-suresi: { gorunen-ad: "Odak Süresi", maksimum-rank: 4, etki: { tur: ABILITY_DURATION_BONUS, kabiliyet: avci-odagi, deger-rank-basina: 0.10 } }
      yikim-gucu: { gorunen-ad: "Yıkım Gücü", maksimum-rank: 4, etki: { tur: ABILITY_EFFECT_BONUS, kabiliyet: yikici-darbe, deger-rank-basina: 0.08 } }
      # B Plani: temel bekleme 120 sn -> her rank -15 sn (rank 4'te 60 sn).
      kacis-ritmi: { gorunen-ad: "Kaçış Ritmi", maksimum-rank: 4, etki: { tur: ABILITY_COOLDOWN_REDUCTION, kabiliyet: b-plani, deger-rank-basina: 0.125 } }
      # B Plani: temel sure 5 sn -> her rank +5 sn (rank 4'te 25 sn).
      golge-suresi: { gorunen-ad: "Gölge Süresi", maksimum-rank: 4, etki: { tur: ABILITY_DURATION_BONUS, kabiliyet: b-plani, deger-rank-basina: 1.0 } }
      # Kan Yemini: temel bekleme 450 sn -> her rank -30 sn (rank 4'te 330 sn).
      kan-ritmi: { gorunen-ad: "Kan Ritmi", maksimum-rank: 4, etki: { tur: ABILITY_COOLDOWN_REDUCTION, kabiliyet: kan-yemini, deger-rank-basina: 0.0667 } }
      # Kan Yemini: temel can-orani %15 -> her rank +%5 (rank 4'te %35).
      kan-yemini-gucu: { gorunen-ad: "Kan Bağı", maksimum-rank: 4, etki: { tur: ABILITY_EFFECT_BONUS, kabiliyet: kan-yemini, deger-rank-basina: 0.3333 } }
      # Kan Yemini: temel Hiz 1 -> her rank +1 seviye (rank 2'de Hiz 3).
      kan-hizi: { gorunen-ad: "Kan Hızı", maksimum-rank: 2, etki: { tur: ABILITY_LIMIT_BONUS, kabiliyet: kan-yemini, deger-rank-basina: 1 } }

  madenci:
    gorunen-ad: "Mağara Adamı"
    sinerji-beceriler: [madencilik]
    bossbar-rengi: MAVI
    simge: DIAMOND_PICKAXE
    cerceve: BLUE_STAINED_GLASS_PANE
    prestij-etkisi: { tur: MAX_ENERGY, deger-basina: 3 }
    yetenekler:
      # --- Özellik yetenekleri ---
      maden-canliligi: { gorunen-ad: "Maden Canlılığı", maksimum-rank: 4, etki: { tur: MAX_HEALTH, deger-rank-basina: 2 } }
      maden-dayanikliligi: { gorunen-ad: "Maden Dayanıklılığı", maksimum-rank: 4, etki: { tur: MAX_ENERGY, deger-rank-basina: 5 } }
      # --- Kabiliyet yetenekleri ---
      # Bulldozer: blok basi 3 enerji -> her rank -1 (rank 2'de 1 enerji).
      bulldozer-tasarrufu: { gorunen-ad: "Bulldozer Tasarrufu", maksimum-rank: 2, etki: { tur: ABILITY_BLOCK_ENERGY_REDUCTION, kabiliyet: bulldozer, deger-rank-basina: 1 } }
      # Bulldozer: temel bekleme 150 sn -> her rank -15 sn (rank 4'te 90 sn).
      bulldozer-ritmi: { gorunen-ad: "Bulldozer Ritmi", maksimum-rank: 4, etki: { tur: ABILITY_COOLDOWN_REDUCTION, kabiliyet: bulldozer, deger-rank-basina: 0.10 } }
      # Madenci Refleksleri: temel bekleme 120 sn -> her rank -15 sn (rank 4'te 60 sn).
      refleks-ritmi: { gorunen-ad: "Refleks Ritmi", maksimum-rank: 4, etki: { tur: ABILITY_COOLDOWN_REDUCTION, kabiliyet: madenci-refleksleri, deger-rank-basina: 0.125 } }
      # Madenci Refleksleri: temel +3 Verimlilik -> her rank +1 (rank 3'te +6).
      refleks-keskinligi: { gorunen-ad: "Refleks Keskinliği", maksimum-rank: 3, etki: { tur: ABILITY_LIMIT_BONUS, kabiliyet: madenci-refleksleri, deger-rank-basina: 1 } }
      # Madenci Refleksleri: temel sure 10 sn -> her rank +5 sn (rank 4'te 30 sn).
      refleks-suresi: { gorunen-ad: "Refleks Süresi", maksimum-rank: 4, etki: { tur: ABILITY_DURATION_BONUS, kabiliyet: madenci-refleksleri, deger-rank-basina: 0.5 } }
      # Kaya Patlamasi: temel bekleme 300 sn -> her rank -30 sn (rank 4'te 180 sn).
      patlama-ritmi: { gorunen-ad: "Patlama Ritmi", maksimum-rank: 4, etki: { tur: ABILITY_COOLDOWN_REDUCTION, kabiliyet: kaya-patlamasi, deger-rank-basina: 0.10 } }
      # Kaya Patlamasi: temel yaricap 7 -> her rank +1 blok (rank 4'te 11).
      patlama-alani: { gorunen-ad: "Patlama Alanı", maksimum-rank: 4, etki: { tur: ABILITY_LIMIT_BONUS, kabiliyet: kaya-patlamasi, deger-rank-basina: 1 } }
      fener-ritmi: { gorunen-ad: "Fener Ritmi", maksimum-rank: 4, etki: { tur: ABILITY_COOLDOWN_REDUCTION, kabiliyet: maden-feneri, deger-rank-basina: 0.05 } }

  tabiat-varisi:
    gorunen-ad: "Tabiat Vârisi"
    # Tek sinif dort beceriyi birden besler. Her beceri icin tam olarak bir
    # kabiliyeti vardir (bkz. abilities.yml); yetenek agaci ise o dort
    # kabiliyetin uzerine kuruludur.
    sinerji-beceriler: [odunculuk, kazicilik, tarimcilik, hayvancilik]
    bossbar-rengi: YESIL
    simge: IRON_AXE
    cerceve: GREEN_STAINED_GLASS_PANE
    prestij-etkisi: { tur: MAX_HEALTH, deger-basina: 1 }
    # Dort beceriyi birden besledigi icin her birinden 100 degil 30 istenir.
    prestij-sinerji-seviyesi: 30
    yetenekler:
      # --- Özellik yetenekleri ---
      canlilik: { gorunen-ad: "Canlılık", maksimum-rank: 4, etki: { tur: MAX_HEALTH, deger-rank-basina: 2 } }
      guc: { gorunen-ad: "Güç", maksimum-rank: 4, etki: { tur: PVE_DAMAGE_MULTIPLIER, deger-rank-basina: 0.03 } }
      dayaniklilik: { gorunen-ad: "Dayanıklılık", maksimum-rank: 4, etki: { tur: MAX_ENERGY, deger-rank-basina: 5 } }
      # --- Kabiliyet yetenekleri ---
      # Agac Kirici: temel enerji 10 -> her rank -1 enerji (rank 4'te 6).
      kesim-tasarrufu: { gorunen-ad: "Kesim Tasarrufu", maksimum-rank: 4, etki: { tur: ABILITY_ENERGY_COST_REDUCTION, kabiliyet: agac-kirici, deger-rank-basina: 0.10 } }
      # Agac Kirici: temel bekleme 180 sn -> her rank -9 sn (rank 4'te 144 sn).
      kesim-ritmi: { gorunen-ad: "Kesim Ritmi", maksimum-rank: 4, etki: { tur: ABILITY_COOLDOWN_REDUCTION, kabiliyet: agac-kirici, deger-rank-basina: 0.05 } }
      # Agac Kirici: temel 64 kutuk -> her rank +1 kutuk.
      kesim-uzmanligi: { gorunen-ad: "Kesim Uzmanlığı", maksimum-rank: 4, etki: { tur: ABILITY_LIMIT_BONUS, kabiliyet: agac-kirici, deger-rank-basina: 1 } }
      # Doga Ana'nin Koruyuculari: temel sure 10 sn -> her rank +5 sn (rank 4'te 30 sn).
      koruyucu-suresi: { gorunen-ad: "Koruyucu Süresi", maksimum-rank: 4, etki: { tur: ABILITY_DURATION_BONUS, kabiliyet: doga-ana-koruyuculari, deger-rank-basina: 0.5 } }
      # Doga Ana'nin Koruyuculari: temel 6 hayvan -> her rank +1 (rank 2'de 8).
      # Bilerek kucuk: cagriya cevap veren her hayvan ayri bir yol bulma isi.
      koruyucu-cagrisi: { gorunen-ad: "Koruyucu Çağrısı", maksimum-rank: 2, etki: { tur: ABILITY_LIMIT_BONUS, kabiliyet: doga-ana-koruyuculari, deger-rank-basina: 1 } }
      # Doga Ana'nin Koruyuculari: temel bekleme 240 sn -> her rank -15 sn (rank 4'te 180 sn).
      koruyucu-ritmi: { gorunen-ad: "Koruyucu Ritmi", maksimum-rank: 4, etki: { tur: ABILITY_COOLDOWN_REDUCTION, kabiliyet: doga-ana-koruyuculari, deger-rank-basina: 0.0625 } }
      # Filiz Patlamasi: temel yaricap 7 -> her rank +1 blok (rank 4'te 11).
      filiz-genisligi: { gorunen-ad: "Filiz Genişliği", maksimum-rank: 4, etki: { tur: ABILITY_LIMIT_BONUS, kabiliyet: filiz-patlamasi, deger-rank-basina: 1 } }
      # Suru Cagrisi: temel bekleme 480 sn -> her rank -30 sn (rank 4'te 360 sn).
      #
      # Faz 22'de sure yerine beklemeyi kisaltiyor. LOVE_CALL cagri gider gitmez
      # biten bir kabiliyet (2 sn) ve hayvanlarin ask penceresi ondan bagimsiz,
      # yani "suresini uzatmak" rank basina 0,3 saniye gibi hicbir sey ifade
      # etmeyen bir sayi uretiyordu. Harcanmis rankler kaybolmaz: ayni id, ayni
      # havuz, yalnizca daha ise yarar bir etki.
      suru-suresi: { gorunen-ad: "Sürü Ritmi", maksimum-rank: 4, etki: { tur: ABILITY_COOLDOWN_REDUCTION, kabiliyet: suru-cagrisi, deger-rank-basina: 0.0625 } }
