# HalilIbrahimMMO - Sinif ve yetenek agaci ayarlari
# Degerleri degistirebilir, yeni sinif/dal ekleyebilirsiniz. ID'ler ASCII kalmalidir.
sinif-degistirme-bekleme-gun: 7

# YETENEK PUANLARI IKI AYRI HAVUZDUR ve birbirinin yerine harcanamaz:
#   OZELLIK  puani  -> kalici karakter istatistikleri (can, PvE hasar, enerji)
#   KABILIYET puani -> tek bir kabiliyete ozel iyilestirmeler (enerji maliyeti,
#                      bekleme suresi, etki siniri, etki suresi, etki gucu)
# Bir yetenegin hangi havuzdan odendigi "etki.tur" degerinden belirlenir, ayrica
# yazilmaz - kabiliyete ozel her tur zaten bir "kabiliyet" alani ister, digerleri
# istemez. Kabiliyet puani bilerek daha nadirdir.
yetenek-puani:
  ozellik-seviye-basina: 25
  kabiliyet-seviye-basina: 40
  prestij-basina-ozellik: 4
  prestij-basina-kabiliyet: 2

# Sinif seviyesi: sadece secili sinifin "sinerji-beceriler" listesindeki
# becerilerden XP kazanildikca artar. Bir sinif birden fazla beceriyi
# besleyebilir (Tabiat Varisi dordunu birden besler). Bu tamamen gorsel/prestij
# amacli bir ilerleme cizgisi degildir: kabiliyetlerin acilmasi buna baglidir.
sinif-ilerleme:
  maksimum-seviye: 50
  sinerji-xp-bonusu: 0.20
  seviyeler:
    1: 100
    2: 150
    3: 200
    4: 250
    5: 300
    6: 350
    7: 400
