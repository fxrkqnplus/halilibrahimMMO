# HalilIbrahimMMO - Sinif ve yetenek agaci ayarlari
# Degerleri degistirebilir, yeni sinif/dal ekleyebilirsiniz. ID'ler ASCII kalmalidir.
sinif-degistirme-bekleme-gun: 7
seviye-basina-yetenek-puani: 25

# Sinif seviyesi: sadece secili sinifin "sinerji-beceri"sinden XP kazanildikca
# artar (bkz. her sinifin sinerji-beceri alani). Bu tamamen gorsel/prestij
# amacli bir ilerleme cizgisidir; hicbir kabiliyetin acilmasini etkilemez.
sinif-ilerleme:
  maksimum-seviye: 50
  sinerji-xp-bonusu: 0.20
  seviyeler:
    1: 100
    2: 150
    3: 200
    4: 250
