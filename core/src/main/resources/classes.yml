    9: 500
    10: 550
    11: 600
    12: 650
    13: 700
    14: 750
    15: 800
    16: 850
    17: 900
    18: 950
    19: 1000
    20: 1050
    21: 1100
    22: 1150
    23: 1200
    24: 1250
    25: 1300
    26: 1350
    27: 1400
    28: 1450
    29: 1500
    30: 1550
    31: 1600
    32: 1650
    33: 1700
    34: 1750
    35: 1800
    36: 1850
    37: 1900
    38: 1950
    39: 2000
    40: 2050
    41: 2100
    42: 2150
    43: 2200
    44: 2250
