    simge: LEAD
    # 25. seviyede acilan BREED_REFUND ozelligi: bir yavru dogduktan sonra
    # %15 ihtimalle ciftlestirme yemi oyuncuya geri doner (iki ebeveyn icin
    # harcanan iki adet birden). 50'de ikiz dogum acilir; 75 ve 100 ayni iki
    # ozelligin guclu kademeleridir.
    kilometre-taslari:
      25: { tur: BREED_REFUND, deger: 0.15 }
      50: { tur: BREED_TWIN, deger: 0.10 }
      75: { tur: BREED_REFUND, deger: 0.45 }
      100: { tur: BREED_TWIN, deger: 0.30 }
    kaynak:
      # Hayvanciligin hicbir blok/yaratik kaynagi yoktur; tamamen asagidaki
      # eylemlerle kazanilir. Hayvan OLDURMEK avciliga yazilir, hayvanciliga
      # degil - bu beceri hayvani yasatmakla ilgilidir.
      tur: ACTION
    eylemler:
      sut-sagma: { xp: 15, gorunen-ad: "Süt Sağma" }
      # 20 saniyede bir, kayisla en az bir inek/domuz/koyun tasiyorsan.
      hayvan-tasima: { xp: 30, gorunen-ad: "Hayvan Taşıma" }
      koyun-kirpma: { xp: 45, gorunen-ad: "Koyun Kırpma" }
      et-pisirme:
        xp: 60
        gorunen-ad: "Et Pişirme"
        malzemeler: [COOKED_BEEF, COOKED_PORKCHOP, COOKED_MUTTON, COOKED_RABBIT, COOKED_CHICKEN]
      hayvan-ciftlestirme: { xp: 120, gorunen-ad: "Çiftleştirme" }
      pasta-uretimi:
        xp: 150
        gorunen-ad: "Pasta Üretimi"
        malzemeler: [CAKE]
      hayvan-evcillestirme: { xp: 225, gorunen-ad: "Evcilleştirme" }
