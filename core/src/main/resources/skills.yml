# =====================================================================
#  HalilIbrahimMMO - Beceri Ayarları
# =====================================================================
#  Her beceri aynı açık XP eğrisini kullanır; her oyuncunun her beceri için
#  seviye ve XP'si ayrı kaydedilir. Bu dosyayı /haliladmin panelindeki
#  "Yeniden Yükle" düğmesiyle yükleyin.
#
#  XP DEĞERLERİ HAKKINDA: her blok ve yaratık, oyun içindeki gerçek değerine
#  ve zorluğuna göre ödüllendirilir. Kömür ile kadim kalıntı, ya da bir inek
#  ile bir Warden arasında kasıtlı olarak çok büyük bir fark vardır:
#    - Kazıcılık   : 30 XP (toprak) .. 90 XP (kil)
#    - Odunculuk   : 45 XP (meşe) .. 105 XP (nether sapı)
#    - Madencilik  : 12 XP (kömür) .. 300 XP (kadim kalıntı)
#    - Avcılık     : 15 XP (inek/domuz gibi zararsız yaratıklar) .. 2400 XP (Ejderha)
#    - Tarımcılık  : 30 XP (saman) .. 150 XP (köylü ticareti)
#    - Hayvancılık : 15 XP (süt sağma) .. 225 XP (evcilleştirme)
#  Avcılıkta listelenmemiş her yaratık "varsayilan" değerini alır; bu değer
#  bilerek çok düşüktür, çünkü listelenmemiş yaratıklar neredeyse her zaman
#  çiftlikte üretilebilen zararsız hayvanlardır.
#
#  DENGE NOTU: Kazıcılık, odunculuk, tarımcılık ve hayvancılık becerilerinin
#  bütün blok/eylem XP değerleri, bu dört becerinin seviye atlaması diğer
#  ikisine kıyasla belirgin şekilde yavaş kaldığı için 5 KATINA çıkarıldı.
#  Madencilik ve avcılık kasıtlı olarak dokunulmadan bırakıldı; görev ödülleri
#  de (quests.yml) bu artışın dışındadır - onlar kendi dengelerine sahiptir.
#
#  KAYNAK TÜRLERİ (kaynak.tur):
#    BLOCK  : blok kırınca XP verir ("malzemeler" listesi zorunludur)
#    MOB    : yaratık öldürünce XP verir ("varsayilan" zorunludur)
#    ACTION : hiçbir blok/yaratık kaynağı yoktur, sadece "eylemler" ile kazanılır
#
#  EYLEMLER (eylemler): blok kırma ve yaratık öldürme dışındaki tek seferlik
#  oyun anları. Her eylem en fazla BİR beceri tarafından sahiplenilebilir.
#  Bazı eylemler ayrıca bir "malzemeler" listesiyle sınırlandırılır (örneğin
#  hangi pişmiş yemeğin "et" sayıldığı); liste boşsa eylemin kendisi tek şarttır.
#  Kullanılabilir eylem adları:
#    hayvan-ciftlestirme  hayvan-evcillestirme  hayvan-tasima  pasta-uretimi
#    koyun-kirpma  sut-sagma  et-pisirme
#    koylu-ticareti  kemik-tozu  ekmek-uretimi  capa-kullanimi  urun-pisirme
#
#  KİLOMETRE TAŞLARI (kilometre-taslari): 25/50/75/100. seviyelerde kazanılan
#  kalıcı bonuslar. Kullanılabilir türler:
#    -- oyuncuya uygulanan istatistikler --
#    MAX_HEALTH (deger = YARIM KALP puanı; 2 = 1 kalp), PVE_DAMAGE_MULTIPLIER,
#    MAX_ENERGY, HASTE, SPEED
#    -- açılan özellikler (oyuncuya hiçbir şey uygulanmaz, o an okunur) --
#    TREE_FELLING (ağaç devirme - deger = en fazla kaç kütük düşeceği)
#    BREED_REFUND (çiftleştirme yemi iadesi - deger = 0-1 arası ihtimal)
#    BREED_TWIN   (ikiz doğum - deger = 0-1 arası ihtimal)
#    DOUBLE_DROP  (bu becerinin KENDİ bloklarından iki kat düşme - 0-1 ihtimal)
#    EXCAVATION   (bu becerinin bloklarında 3x3 geniş kazı - deger = ek blok sınırı)
#    AUTO_REPLANT (olgun ekinin kendini yeniden ekmesi - 0-1 ihtimal)
#
#  TASARIM KURALI: kilometre taşları artık "herkese ekstra can" değildir.
#  Her beceri KENDİ işine yarayan bir şey kazandırır (madencilikte Acele,
#  odunculukta ağaç devirme, tarımda otomatik ekim, hayvancılıkta ikiz doğum
#  gibi) ve kademeler zayıftan güçlüye sıralanır: 25. seviye küçük bir giriş
#  bonusu, 100. seviye becerinin asıl ödülüdür. Ekstra can yalnızca avcılıkta
#  vardır - orada dayanıklılık becerinin kendi konusudur.
#
#  ÖNEMLİ: Oyuncunun kendi yerleştirdiği bloklar hiç XP vermez ve üzerlerinde
#  hiçbir kabiliyet çalışmaz - yalnızca dünyanın kendi oluşturduğu bloklar
#  sayılır. Tek istisna EKİNLERDİR: tarım zaten "ek ve biç" demek olduğu için
#  ekinler bu kuraldan muaftır, ama yalnızca TAM OLGUNLAŞMIŞ hâlde XP verirler.
# =====================================================================

