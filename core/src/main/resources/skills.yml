      25: { tur: MAX_ENERGY, deger: 10 }
      50: { tur: MAX_HEALTH, deger: 2 }
      75: { tur: MAX_ENERGY, deger: 10 }
      100: { tur: MAX_ENERGY, deger: 10 }
