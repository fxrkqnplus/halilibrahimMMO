        WITHER: { xp: 1200, gorunen-ad: "Wither" }
        WARDEN: { xp: 1800, gorunen-ad: "Warden" }
        ENDER_DRAGON: { xp: 2400, gorunen-ad: "Ejderha" }

  tarimcilik:
    gorunen-ad: "Tarımcılık"
    simge: WHEAT
    # Tarim hem blok hem eylem kaynagi olan tek beceridir: hasat bloklarindan
    # ve tarlanin etrafindaki islerden ayni anda XP kazanir.
    # Tarimin imzasi otomatik ekim: 50'de hasadin yarisi kendini yeniden eker,
    # 100'de tamami. En yuksek kademe gecerlidir, toplanmaz.
    kilometre-taslari:
      25: { tur: DOUBLE_DROP, deger: 0.08 }
      50: { tur: AUTO_REPLANT, deger: 0.50 }
      75: { tur: DOUBLE_DROP, deger: 0.20 }
      100: { tur: AUTO_REPLANT, deger: 1.0 }
    kaynak:
      tur: BLOCK
      # Ekinler yalnizca TAM OLGUNLASMIS halde XP verir; olmamis bir ekini
      # kirip yeniden ekmek hicbir sey kazandirmaz. Saman balyalari ise
      # "oyuncunun yerlestirdigi blok sayilmaz" kuralina tabidir, yani sadece
      # koylerdeki dogal balyalar sayilir.
      malzemeler:
        HAY_BLOCK: { xp: 30, gorunen-ad: "Saman Balyası" }
        WHEAT: { xp: 45, gorunen-ad: "Buğday" }
        CARROTS: { xp: 45, gorunen-ad: "Havuç" }
        POTATOES: { xp: 45, gorunen-ad: "Patates" }
        BEETROOTS: { xp: 45, gorunen-ad: "Pancar" }
        SWEET_BERRY_BUSH: { xp: 45, gorunen-ad: "Tatlı Böğürtlen" }
        MELON: { xp: 60, gorunen-ad: "Karpuz" }
        PUMPKIN: { xp: 60, gorunen-ad: "Balkabağı" }
        COCOA: { xp: 60, gorunen-ad: "Kakao" }
        NETHER_WART: { xp: 75, gorunen-ad: "Nether Mantarı" }
        TORCHFLOWER_CROP: { xp: 90, gorunen-ad: "Meşale Çiçeği" }
        PITCHER_CROP: { xp: 90, gorunen-ad: "Testi Bitkisi" }
    eylemler:
      capa-kullanimi: { xp: 15, gorunen-ad: "Çapalama" }
      kemik-tozu: { xp: 30, gorunen-ad: "Kemik Tozu" }
      urun-pisirme:
        xp: 45
        gorunen-ad: "Ürün Pişirme"
        malzemeler: [BAKED_POTATO, DRIED_KELP]
      ekmek-uretimi:
        xp: 60
        gorunen-ad: "Ekmek Üretimi"
        malzemeler: [BREAD]
      koylu-ticareti: { xp: 150, gorunen-ad: "Köylü Ticareti" }

  hayvancilik:
