beceriler:
  kazicilik:
    gorunen-ad: "Kazıcılık"
    simge: IRON_SHOVEL
    # Kazicilik toprak/kum/cakil isidir: odulleri de kurekle yapilan isi
    # hizlandirir. 75'te acilan genis kazi bu becerinin imza ozelligidir.
    kilometre-taslari:
      25: { tur: DOUBLE_DROP, deger: 0.10 }
      50: { tur: MAX_ENERGY, deger: 15 }
      75: { tur: EXCAVATION, deger: 8 }
      100: { tur: DOUBLE_DROP, deger: 0.30 }
    kaynak:
      tur: BLOCK
      malzemeler:
        DIRT: { xp: 30, gorunen-ad: "Toprak" }
        GRASS_BLOCK: { xp: 30, gorunen-ad: "Çimen Bloğu" }
        COARSE_DIRT: { xp: 30, gorunen-ad: "Sert Toprak" }
        SAND: { xp: 30, gorunen-ad: "Kum" }
        ROOTED_DIRT: { xp: 45, gorunen-ad: "Köklü Toprak" }
        PODZOL: { xp: 45, gorunen-ad: "Podzol" }
        MYCELIUM: { xp: 45, gorunen-ad: "Misel" }
        RED_SAND: { xp: 45, gorunen-ad: "Kızıl Kum" }
        GRAVEL: { xp: 45, gorunen-ad: "Çakıl" }
        SOUL_SAND: { xp: 75, gorunen-ad: "Ruh Kumu" }
        SOUL_SOIL: { xp: 75, gorunen-ad: "Ruh Toprağı" }
        CLAY: { xp: 90, gorunen-ad: "Kil" }

  odunculuk:
    gorunen-ad: "Odunculuk"
    simge: IRON_AXE
    # 25. seviyede acilan TREE_FELLING ozelligi: bir agacin toprakla temas
    # eden KOK kutugunu kestiginde agacin tamami devrilir (bagli tum kutukler
    # birden duser). Govdenin ortasindan kesmek bunu tetiklemez. 75'te ayni
    # ozellik iki katina cikar - en yuksek kademe gecerlidir, toplanmaz.
    kilometre-taslari:
      25: { tur: TREE_FELLING, deger: 48 }
      50: { tur: DOUBLE_DROP, deger: 0.12 }
      75: { tur: TREE_FELLING, deger: 96 }
      100: { tur: DOUBLE_DROP, deger: 0.30 }
    kaynak:
      tur: BLOCK
      malzemeler:
        OAK_LOG: { xp: 45, gorunen-ad: "Meşe Kütüğü" }
        SPRUCE_LOG: { xp: 45, gorunen-ad: "Ladin Kütüğü" }
        BIRCH_LOG: { xp: 45, gorunen-ad: "Huş Kütüğü" }
        JUNGLE_LOG: { xp: 60, gorunen-ad: "Orman Kütüğü" }
        ACACIA_LOG: { xp: 60, gorunen-ad: "Akasya Kütüğü" }
        DARK_OAK_LOG: { xp: 60, gorunen-ad: "Kara Meşe Kütüğü" }
        MANGROVE_LOG: { xp: 60, gorunen-ad: "Mangrov Kütüğü" }
        CHERRY_LOG: { xp: 75, gorunen-ad: "Kiraz Kütüğü" }
        PALE_OAK_LOG: { xp: 75, gorunen-ad: "Solgun Meşe Kütüğü" }
        CRIMSON_STEM: { xp: 105, gorunen-ad: "Kızıl Sap" }
        WARPED_STEM: { xp: 105, gorunen-ad: "Çarpık Sap" }

  madencilik:
    gorunen-ad: "Madencilik"
    simge: IRON_PICKAXE
    # Madenciligin imzasi Acele: kazma hizi dogrudan bu becerinin konusudur.
    kilometre-taslari:
      25: { tur: DOUBLE_DROP, deger: 0.08 }
      50: { tur: HASTE, deger: 0 }
      75: { tur: DOUBLE_DROP, deger: 0.20 }
      100: { tur: HASTE, deger: 1 }
    kaynak:
      tur: BLOCK
      # Cevherler oyun ici degerlerine gore siralanir: komur en ucuz, kadim
      # kalinti en pahali olani. Redstone bilerek altinin cok altindadir.
      malzemeler:
        COAL_ORE: { xp: 12, gorunen-ad: "Kömür Cevheri" }
        DEEPSLATE_COAL_ORE: { xp: 12, gorunen-ad: "Kömür Cevheri" }
        COPPER_ORE: { xp: 15, gorunen-ad: "Bakır Cevheri" }
        DEEPSLATE_COPPER_ORE: { xp: 15, gorunen-ad: "Bakır Cevheri" }
        NETHER_QUARTZ_ORE: { xp: 18, gorunen-ad: "Kuvars Cevheri" }
        REDSTONE_ORE: { xp: 21, gorunen-ad: "Redstone Cevheri" }
        DEEPSLATE_REDSTONE_ORE: { xp: 21, gorunen-ad: "Redstone Cevheri" }
        NETHER_GOLD_ORE: { xp: 24, gorunen-ad: "Nether Altın Cevheri" }
        IRON_ORE: { xp: 27, gorunen-ad: "Demir Cevheri" }
        DEEPSLATE_IRON_ORE: { xp: 27, gorunen-ad: "Demir Cevheri" }
        LAPIS_ORE: { xp: 36, gorunen-ad: "Lapis Cevheri" }
        DEEPSLATE_LAPIS_ORE: { xp: 36, gorunen-ad: "Lapis Cevheri" }
