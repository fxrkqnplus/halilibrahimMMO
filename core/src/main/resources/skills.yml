        DEEPSLATE_EMERALD_ORE: { xp: 180, gorunen-ad: "Zümrüt Cevheri" }
        ANCIENT_DEBRIS: { xp: 300, gorunen-ad: "Kadim Kalıntı" }

  avcilik:
    gorunen-ad: "Avcılık"
    simge: IRON_SWORD
    # Ekstra can YALNIZCA burada var: dovusun icinde ayakta kalmak avciligin
    # kendi konusu. deger yarim-kalp puanidir, yani 2 = 1 kalp, 6 = 3 kalp.
    kilometre-taslari:
      25: { tur: MAX_HEALTH, deger: 2 }
      50: { tur: PVE_DAMAGE_MULTIPLIER, deger: 0.05 }
      75: { tur: MAX_HEALTH, deger: 6 }
      100: { tur: PVE_DAMAGE_MULTIPLIER, deger: 0.20 }
    kaynak:
      tur: MOB
