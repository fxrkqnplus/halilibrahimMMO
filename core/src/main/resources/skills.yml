        STRAY: { xp: 30, gorunen-ad: "Kayıp" }
        CAVE_SPIDER: { xp: 30, gorunen-ad: "Mağara Örümceği" }
        MAGMA_CUBE: { xp: 30, gorunen-ad: "Magma Küpü" }
        BOGGED: { xp: 30, gorunen-ad: "Bataklık İskeleti" }
