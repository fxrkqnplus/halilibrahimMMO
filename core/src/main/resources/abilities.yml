# =====================================================================
#  HalilIbrahimMMO - Kabiliyet ve Enerji Ayarları
# =====================================================================
#  Kabiliyetler /kabiliyet menüsünden seçilir ve uygun aleti tutarken havaya,
#  bir bloğa ya da bir yaratığa sağ tıklayarak etkinleştirilir. Bunun dışında
#  kabiliyet kullanmanın başka bir yolu yoktur. Blok kabiliyetleri, etki-suresi-saniye
#  içinde yalnız sonraki uygun blok kırmada tüketilir. Her kabiliyet tam
#  olarak bir sınıfa aittir (sinif alanı) - o sınıf seçili olmayan bir
#  oyuncu bu kabiliyeti kullanamaz.
#
#  Kabiliyet bir kez başladıktan sonra elindeki eşyayı değiştirmen onu
#  bozmaz; alet yalnızca kabiliyeti BAŞLATMAK için gereklidir.
#
#  sure-modu: SURE (varsayılan) kabiliyet sadece etki-suresi-saniye kadar
#  sürer. ENERJI ise (yalnız etki.tur: DAMAGE_BUFF ile birlikte kullanılabilir)
#  her isabetli vuruşta enerji-vurus-basi kadar enerji tüketir ve enerji
#  biterse kabiliyet erken sona erer; etki-suresi-saniye yine de bir üst
#  sınır (güvenlik freni) olarak kalır.
#
#  simge: kabiliyet menüsünde görünen eşya simgesi (herhangi bir Bukkit
#  Material adı). Seçili kabiliyet ayrıca büyülü (parlayan) görünür.
#
#  gorsel: her kabiliyetin kendine ait rengi, etkinleştirme sesi ve
#  partikülü. Bu bölüm isteğe bağlıdır; yazılmazsa kabiliyet feedback.yml
#  içindeki ortak "kabiliyet-baslangic" sesini kullanır ve partikül çıkarmaz.
#    renk           : KIRMIZI, TURUNCU, SARI, YESIL, KOYU_YESIL, TURKUAZ,
#                     MAVI, MOR, KOYU_MOR, BEYAZ
#    ses            : bir Bukkit Sound adı
#    partikul       : bir Bukkit Particle adı (DUST ise "renk" ile boyanır)
#    partikul-sayisi: kaç partikül saçılacağı
# =====================================================================

enerji:
  maksimum: 100
  # Enerjinin saniyede kac puan dolduğu. Yuksek deger = daha hizli dolan bar.
  yenilenme-saniye-basina: 6

# Menüden farklı bir kabiliyet secmeden once beklenmesi gereken sure (ayni
# kabiliyeti yeniden secmek her zaman ucretsizdir).
secim-bekleme-saniye: 120

kabiliyetler:
  # ----- Define Avcısı (savasci) - sinerji: kazicilik -----
  hazine-sezgisi:
    gorunen-ad: "Hazine Sezgisi"
    aciklama: "Etkinken kırdığın bloklardan %50 ihtimalle ekstra bir düşme kazanırsın."
    simge: GOLDEN_SHOVEL
    beceri: kazicilik
    sinif: savasci
    gerekli-seviye: 5
    enerji: 20
    bekleme-suresi-saniye: 90
    etki-suresi-saniye: 20
    arac:
      tur: SHOVEL
    etki:
      tur: EXTRA_DROP_CHANCE
      sans: 0.5
    gorsel:
      renk: SARI
      ses: BLOCK_AMETHYST_BLOCK_CHIME
      ses-seviyesi: 0.9
      ton: 1.4
      partikul: WAX_ON
      partikul-sayisi: 40

  kazici-darbe:
    gorunen-ad: "Kazıcı Darbesi"
    aciklama: "Sonraki uygun blok kırmanda çevredeki 9 bloğu birden kazır."
    simge: IRON_SHOVEL
    beceri: kazicilik
    sinif: savasci
    gerekli-seviye: 10
    enerji: 20
    bekleme-suresi-saniye: 60
    etki-suresi-saniye: 15
    # Menuden secilip sag tikla etkinlestirmek icin gereken alet: herhangi bir kurek.
    arac:
      tur: SHOVEL
    etki:
      tur: EXCAVATE
      limit: 9
    gorsel:
      renk: TURUNCU
      ses: BLOCK_GRASS_BREAK
      ses-seviyesi: 1.0
      ton: 0.7
      partikul: DUST_PLUME
      partikul-sayisi: 45

  define-refleksi:
    gorunen-ad: "Define Refleksi"
    aciklama: "3 saniye boyunca neredeyse tüm hasara karşı dirençli olursun."
    simge: SHIELD
    beceri: kazicilik
    sinif: savasci
    gerekli-seviye: 30
    enerji: 30
    bekleme-suresi-saniye: 150
    etki-suresi-saniye: 3
    arac:
      tur: ANY
    etki:
      tur: BRIEF_INVULNERABILITY
    gorsel:
      renk: BEYAZ
      ses: ENTITY_IRON_GOLEM_REPAIR
      ses-seviyesi: 1.0
      ton: 1.2
      partikul: TOTEM_OF_UNDYING
      partikul-sayisi: 60

  # ----- Orman Bekçisi (oduncu) - sinerji: odunculuk -----
  yesil-yol:
    gorunen-ad: "Yeşil Yol"
    aciklama: "10 saniye boyunca hareket hızın artar."
    simge: SUGAR
    beceri: odunculuk
    sinif: oduncu
    gerekli-seviye: 5
    enerji: 20
    bekleme-suresi-saniye: 75
    etki-suresi-saniye: 10
    arac:
      tur: AXE
    etki:
      tur: SPEED_BURST
    gorsel:
      renk: KOYU_YESIL
      ses: ENTITY_BAT_TAKEOFF
      ses-seviyesi: 1.0
      ton: 1.5
      partikul: HAPPY_VILLAGER
      partikul-sayisi: 40

  agac-kirici:
    gorunen-ad: "Ağaç Kırıcı"
    aciklama: "Sonraki ağaç kırmanda bağlı tüm kütükleri (en fazla 32) birden keser."
    simge: IRON_AXE
    beceri: odunculuk
    sinif: oduncu
    gerekli-seviye: 15
    enerji: 25
    bekleme-suresi-saniye: 75
    etki-suresi-saniye: 15
    # Menuden secilip sag tikla etkinlestirmek icin gereken alet: herhangi bir balta.
    arac:
      tur: AXE
    etki:
      tur: TREE_FELL
      limit: 32
    gorsel:
      renk: YESIL
      ses: ITEM_AXE_STRIP
      ses-seviyesi: 1.0
      ton: 0.8
      partikul: CHERRY_LEAVES
      partikul-sayisi: 50

  doga-sifasi:
    gorunen-ad: "Doğa Şifası"
    aciklama: "8 saniye boyunca can yenilenmen hızlanır."
    simge: GLISTERING_MELON_SLICE
    beceri: odunculuk
    sinif: oduncu
    gerekli-seviye: 30
    enerji: 25
    bekleme-suresi-saniye: 120
    etki-suresi-saniye: 8
    arac:
      tur: HOE
    etki:
      tur: AREA_HEAL
    gorsel:
      renk: MOR
      ses: ENTITY_ZOMBIE_VILLAGER_CURE
      ses-seviyesi: 0.8
      ton: 1.4
      partikul: HEART
      partikul-sayisi: 25

  # ----- Amansız Savaşçı (avci) - sinerji: avcilik -----
  gece-gorusu:
    gorunen-ad: "Gece Görüşü"
    aciklama: "60 saniye boyunca karanlıkta net görürsün."
    simge: GOLDEN_CARROT
    beceri: avcilik
    sinif: avci
    gerekli-seviye: 5
    enerji: 15
    bekleme-suresi-saniye: 120
    etki-suresi-saniye: 60
    arac:
      tur: SWORD
    etki:
      tur: NIGHT_VISION
    gorsel:
      renk: KOYU_MOR
      ses: ENTITY_ILLUSIONER_MIRROR_MOVE
      ses-seviyesi: 0.9
      ton: 1.3
      partikul: SCULK_SOUL
      partikul-sayisi: 35

  avci-odagi:
    gorunen-ad: "Avcı Odağı"
    aciklama: "Etkinken verdiğin PvE hasarı %50 artar (yalnızca yaratıklara karşı - PvP'de geçerli değildir). Her isabetli vuruşta enerji tüketir; enerjin biterse ya da en fazla 30 saniye sonra kendiliğinden sona erer."
    simge: IRON_SWORD
    beceri: avcilik
    sinif: avci
    gerekli-seviye: 10
    enerji: 25
    bekleme-suresi-saniye: 90
    etki-suresi-saniye: 30
    sure-modu: ENERJI
    enerji-vurus-basi: 16
    # Menuden secilip sag tikla etkinlestirmek icin gereken alet: herhangi bir kilic.
    arac:
      tur: SWORD
    etki:
      tur: DAMAGE_BUFF
      limit: 1
      hasar-carpani: 1.5
    gorsel:
      renk: KIRMIZI
      ses: ENTITY_PLAYER_ATTACK_SWEEP
      ses-seviyesi: 1.0
      ton: 0.7
      partikul: CRIT
      partikul-sayisi: 45

  yikici-darbe:
    gorunen-ad: "Yıkıcı Darbe"
    aciklama: "Ayağının altında bir patlama yaratır: 4 blok yarıçapındaki tüm yaratıkları çok uzağa savurur ve ağır hasar verir."
    simge: TNT
    beceri: avcilik
    sinif: avci
    gerekli-seviye: 30
    enerji: 30
    bekleme-suresi-saniye: 30
    etki-suresi-saniye: 2
    arac:
      tur: SWORD
    etki:
      tur: KNOCKBACK_SLAM
      yaricap: 4
      # KNOCKBACK_SLAM icin bu bir carpan degil, dogrudan verilen ham hasardir.
      hasar-carpani: 9.0
    # Patlama sesi/partikulu kabiliyetin kendi etkisinde zaten var; buradaki
    # ses onun uzerine binen "catlama" vurusudur.
    gorsel:
      renk: TURUNCU
      ses: BLOCK_ANVIL_LAND
      ses-seviyesi: 1.0
      ton: 0.6
      partikul: LARGE_SMOKE
      partikul-sayisi: 40

  # ----- Mağara Adamı (madenci) - sinerji: madencilik -----
  cevher-sezgisi:
    gorunen-ad: "Cevher Sezgisi"
    aciklama: "Etkinken kırdığın bloklardan %40 ihtimalle ekstra bir düşme kazanırsın."
    simge: GOLDEN_PICKAXE
    beceri: madencilik
    sinif: madenci
    gerekli-seviye: 5
    enerji: 25
    bekleme-suresi-saniye: 90
    etki-suresi-saniye: 20
    arac:
      tur: PICKAXE
    etki:
      tur: EXTRA_DROP_CHANCE
      sans: 0.4
    gorsel:
      renk: TURKUAZ
      ses: BLOCK_AMETHYST_CLUSTER_BREAK
      ses-seviyesi: 1.0
      ton: 1.3
      partikul: GLOW
      partikul-sayisi: 40

  damar-kirici:
    gorunen-ad: "Damar Kırıcı"
    aciklama: "Sonraki uygun blok kırmanda bağlı aynı cevher damarını (en fazla 16 blok) birden kazır."
    simge: IRON_PICKAXE
    beceri: madencilik
    sinif: madenci
    gerekli-seviye: 20
    enerji: 30
    bekleme-suresi-saniye: 100
    etki-suresi-saniye: 15
    # Menuden secilip sag tikla etkinlestirmek icin gereken alet: herhangi bir kazma.
    arac:
      tur: PICKAXE
    etki:
      tur: VEIN_MINE
      limit: 16
    gorsel:
      renk: MAVI
      ses: BLOCK_DEEPSLATE_BREAK
      ses-seviyesi: 1.0
      ton: 0.6
      partikul: DUST
      partikul-sayisi: 50

  maden-feneri:
    gorunen-ad: "Maden Feneri"
    aciklama: "Yalnızca geniş, üstü kapalı bir madende kullanılabilir: 36 blok yarıçapındaki tüm cevherler 30 saniye boyunca duvarların ardından bile parlar. Süre dolmadan kırdığın cevherin parıltısı anında söner."
    simge: GLOWSTONE
    beceri: madencilik
    sinif: madenci
    gerekli-seviye: 35
    enerji: 30
    bekleme-suresi-saniye: 450
    etki-suresi-saniye: 30
    arac:
      tur: PICKAXE
    etki:
      tur: ORE_REVEAL
      yaricap: 36
      # Cevrendeki kupun en az bu kadari bos hava olmali; dar bir tunelde
      # kabiliyet calismaz, genis bir magara/maden salonunda calisir.
      acik-alan-orani: 0.30
    gorsel:
      renk: TURUNCU
      ses: BLOCK_BEACON_ACTIVATE
      ses-seviyesi: 1.0
      ton: 1.4
      partikul: END_ROD
      partikul-sayisi: 60
