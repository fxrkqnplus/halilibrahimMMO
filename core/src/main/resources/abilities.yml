# =====================================================================
#  HalilIbrahimMMO - Kabiliyet ve Enerji Ayarları
# =====================================================================
#  Kabiliyetler /kabiliyet menüsünden seçilir ve uygun aleti tutarken havaya,
#  bir bloğa ya da bir yaratığa ÇİFT sağ tıklayarak etkinleştirilir. Bunun
#  dışında kabiliyet kullanmanın başka bir yolu yoktur. Blok kabiliyetleri,
#  etki-suresi-saniye içinde yalnız sonraki uygun blok kırmada tüketilir.
#  Her kabiliyet tam olarak bir sınıfa aittir (sinif alanı) - o sınıf seçili
#  olmayan bir oyuncu bu kabiliyeti kullanamaz.
#
#  Kabiliyet bir kez başladıktan sonra elindeki eşyayı değiştirmen onu
#  bozmaz; alet yalnızca kabiliyeti BAŞLATMAK için gereklidir.
#
#  ---------------------------------------------------------------------
#  HER SINIFTA DÖRT KABİLİYET VARDIR ve hepsi aynı basamaklarda açılır:
#      10 -> 20 -> 35 -> 50 (sınıf seviyesi)
#  Basamak yükseldikçe kabiliyet güçlenir ve bekleme süresi uzar. 50.
#  seviyedeki kabiliyet sınıfın "son sözü"dür: en güçlü etki, en uzun
#  bekleme süresi (10 dakika).
#  ---------------------------------------------------------------------
#
#  ENERJİ NASIL ÇALIŞIR (Faz 20 Bölüm 2'de değişti):
#    - Enerji SADECE kabiliyet kullanırken harcanır; başka hiçbir şey
#      enerji götürmez.
#    - Bir kabiliyet açıkken enerji ASLA yenilenmez. Kabiliyet bittikten
#      sonra yenilenme yeniden başlar.
#    - "enerji"          : kabiliyeti başlatmanın tek seferlik bedeli.
#    - "enerji-blok-basi": süpürme kabiliyetlerinde (TREE_FELL / VEIN_MINE /
#                          EXCAVATE / BLAST_MINE) düşen HER blok için ayrıca
#                          harcanır. Enerji biterse süpürme orada durur -
#                          yani bir seferde kaç blok alacağını blok sınırı
#                          değil enerji barın belirler.
#    - "enerji-vurus-basi": sadece sure-modu ENERJI olan kabiliyetlerde, her
#                          isabetli vuruşta harcanır.
#    - Süpürme sırasında düşen her blok için elindeki alet 1 dayanıklılık
#      kaybeder - blokları elle kırsaydın ödeyeceğin bedelin aynısı.
#
#  sure-modu: SURE (varsayılan) kabiliyet sadece etki-suresi-saniye kadar
#  sürer. ENERJI ise (yalnız etki.tur: DAMAGE_BUFF ile birlikte kullanılabilir)
#  her isabetli vuruşta enerji-vurus-basi kadar enerji tüketir ve enerji
#  biterse kabiliyet erken sona erer; etki-suresi-saniye yine de bir üst
#  sınır (güvenlik freni) olarak kalır.
#
#  simge: kabiliyet menüsünde görünen eşya simgesi (herhangi bir Bukkit
#  Material adı). Seçili kabiliyet ayrıca büyülü (parlayan) görünür.
#
#  gorsel: her kabiliyetin kendine ait rengi, sesi ve partikül gösterisi.
#  Bu bölüm isteğe bağlıdır; yazılmazsa kabiliyet feedback.yml içindeki
#  ortak "kabiliyet-baslangic" sesini kullanır ve partikül çıkarmaz.
#    renk           : KIRMIZI, TURUNCU, SARI, YESIL, KOYU_YESIL, TURKUAZ,
#                     MAVI, MOR, KOYU_MOR, BEYAZ
#    ses            : bir Bukkit Sound adı
#    yanki-ses      : 4 tick sonra biraz daha tiz çalan ikinci ses (isteğe
#                     bağlı). Tek bir örneği "an"a dönüştüren şey budur.
#    partikul       : bir Bukkit Particle adı (DUST ise "renk" ile boyanır)
#    partikul-sayisi: gösteride kullanılacak partikül yoğunluğu
#    sekil          : partiküllerin nasıl dizileceği
#                     PATLAMA (saçılma, varsayılan) | HALKA (genişleyen
#                     halkalar) | SARMAL (yukarı sarılan helis) |
#                     KUBBE (baş üstünde kubbe)
# =====================================================================

enerji:
  maksimum: 100
  # Enerjinin saniyede kac puan doldugu. Kabiliyet ACIKKEN bu hic islemez.
  # 3 puan/saniye = bos bardan dolu bara yaklasik 33 saniye.
  yenilenme-saniye-basina: 3

# Menüden farklı bir kabiliyet secmeden once beklenmesi gereken sure (ayni
# kabiliyeti yeniden secmek her zaman ucretsizdir).
secim-bekleme-saniye: 120

kabiliyetler:
  # =====================================================================
  #  Tabiat Vârisi (tabiat-varisi)
  #  Sinerji: odunculuk + kazicilik + tarimcilik + hayvancilik
  #  Dort becerinin her biri icin tam olarak bir kabiliyet:
  #  Agac Kirici (10, odunculuk) -> Filiz Patlamasi (20, tarimcilik) ->
  #  Doga Ana'nin Koruyuculari (35, kazicilik) -> Suru Cagrisi (50, hayvancilik)
  # =====================================================================
  doga-ana-koruyuculari:
    gorunen-ad: "Doğa Ana'nın Koruyucuları"
    aciklama: "Yalnızca çevrende hayvan varken kullanılabilir. En yakın 6 hayvan (inek, domuz, koyun, tavuk, panda, demir golem...) sana saldıran yaratığın üstüne koşar, ona vurur ve onu senden uzaklaştırır. Yaralanan her koruyucuyu enerjinle iyileştirirsin: 5 enerji = 1 kalp. Enerjin bitse bile kabiliyet kapanmaz, süre bitince kapanır. Bütün koruyucular ölürse kendiliğinden sona erer. Evcilleştirilmiş at, eşek, kurt, kedi ve köylüler çağrıya katılmaz."
    simge: LEAD
    beceri: kazicilik
    sinif: tabiat-varisi
    gerekli-seviye: 35
    enerji: 20
    bekleme-suresi-saniye: 240
    etki-suresi-saniye: 10
    # Aleti "herhangi bir sey": bu bir savas kabiliyeti degil, bir yardim
    # cagrisidir - saldiriya ugradiginda elinde ne varsa onunla acilmali.
    arac:
      tur: ANY
    etki:
      tur: GUARDIAN_CALL
      # Cagriya kac hayvan cevap verir. Odak agacindan arttirilabilir.
      hayvan-sayisi: 6
      # Bir hayvanin bir vurusunun degeri. Az olmasi kasitli: koruyucular
      # yaratigi oldurmez, senden uzaklastirir.
      hasar: 2.0
      # Yaralanan bir koruyucunun bir KALBINI (2 can puani) doldurmanin
      # oyuncuya maliyeti. Enerji bittiginde iyilestirme durur ama kabiliyet
      # calismaya devam eder.
      enerji-kalp-basi: 5
    gorsel:
      renk: YESIL
      ses: ENTITY_WOLF_ANGRY_GROWL
      yanki-ses: ENTITY_COW_AMBIENT
      ses-seviyesi: 1.0
      ton: 1.1
      partikul: HAPPY_VILLAGER
      partikul-sayisi: 32
      sekil: HALKA

  filiz-patlamasi:
    gorunen-ad: "Filiz Patlaması"
    aciklama: "Çevrendeki 7 blok yarıçapındaki bütün olmamış ekinler bir anda hasada hazır hâle gelir. Hiç kemik tozu harcamazsın."
    simge: BONE_MEAL
    beceri: tarimcilik
    sinif: tabiat-varisi
    gerekli-seviye: 20
    enerji: 25
    bekleme-suresi-saniye: 150
    etki-suresi-saniye: 3
    arac:
      tur: HOE
    etki:
      tur: GROWTH_SURGE
      yaricap: 7
    gorsel:
      renk: YESIL
      ses: ITEM_BONE_MEAL_USE
      yanki-ses: BLOCK_MOSS_PLACE
      ses-seviyesi: 1.0
      ton: 1.2
      partikul: COMPOSTER
      partikul-sayisi: 32
      sekil: HALKA

  suru-cagrisi:
    gorunen-ad: "Sürü Çağrısı"
    aciklama: "Çevrendeki 10 blok yarıçapındaki bütün yetişkin hayvanlar tek bir yem harcamadan çiftleşme moduna girer. Sınıfın son basamağı: bir sürüyü tek çağrıyla ikiye katlar."
    simge: WHEAT
    beceri: hayvancilik
    sinif: tabiat-varisi
    gerekli-seviye: 50
    enerji: 30
    # Sinifin son kabiliyeti: 8 dakika bekleme.
    bekleme-suresi-saniye: 480
    # Cagri aninda biter: hayvanlar zaten cagriya o anda karsilik veriyor,
    # kabiliyetin acik kalmasinin bir islevi yok. 2 saniye sonra hem
    # survival'da hem yaratici modda kendiliginden kapanir.
    etki-suresi-saniye: 2
    arac:
      tur: ANY
    etki:
      tur: LOVE_CALL
      yaricap: 10
    gorsel:
      renk: MOR
      ses: ENTITY_CAT_PURR
      yanki-ses: ENTITY_ALLAY_ITEM_GIVEN
      ses-seviyesi: 1.0
      ton: 1.3
      partikul: HEART
      partikul-sayisi: 30
      sekil: KUBBE

  agac-kirici:
    gorunen-ad: "Ağaç Kırıcı"
    aciklama: "2,5 dakika boyunca kestiğin HER ağaç bir bütün olarak devrilir. Düşen her kütük 5 enerji ve baltandan 1 dayanıklılık götürür; enerjin biterse kabiliyet orada kapanır. Enerji kabiliyet açıkken hiç yenilenmez."
    simge: IRON_AXE
    beceri: odunculuk
    sinif: tabiat-varisi
    # Faz 22: sinifin ilk basamagi. Odunculuk Tabiat Varisi'nin en erken
    # ogrendigi is, bu yuzden kabiliyeti de ilk acilan oldu.
    gerekli-seviye: 10
    enerji: 10
    # Ilk basamak oldugu icin bekleme de 5 dakikadan 3 dakikaya indi; suresi ve
    # blok basi enerjisi degismedi, yani bir seferde kac kutuk aldigi ayni.
    bekleme-suresi-saniye: 180
    # SUREKLI KABILIYET: ilk agacta tukenmez. 2,5 dakika boyunca acik kalir ve
    # o sure boyunca kesilen her agac devrilir. Enerji biterse daha erken kapanir.
    etki-suresi-saniye: 150
    # Her dusen kutuk 5 enerji goturur; 100 enerjilik bir barla yaklasik 18
    # kutuk devrilir. Kacini alacagini blok siniri degil enerjin belirler.
    enerji-blok-basi: 5
    # Menuden secilip sag tikla etkinlestirmek icin gereken alet: herhangi bir balta.
    arac:
      tur: AXE
    etki:
      tur: TREE_FELL
      limit: 64
    gorsel:
      renk: YESIL
      ses: ITEM_AXE_STRIP
      yanki-ses: BLOCK_BAMBOO_WOOD_BREAK
      ses-seviyesi: 1.0
      ton: 0.8
      partikul: CHERRY_LEAVES
      partikul-sayisi: 36
      sekil: HALKA

  # =====================================================================
  #  Amansız Savaşçı (avci) - sinerji: avcilik
  #  B Planı (10) -> Avcı Odağı (20) -> Yıkıcı Darbe (35) -> Kan Yemini (50)
  #  Dordunun de aleti MELEE: kilic ya da balta. Balta da bir savas silahidir.
  # =====================================================================
  b-plani:
    gorunen-ad: "B Planı"
    aciklama: "5 saniye boyunca hiçbir yaratık seni göremez: sana nişan almış olanlar hedefini kaybeder, yenisi de seni bulamaz. Aynı süre boyunca Görünmezlik ve Hız 2 alırsın. Kaybedilmiş bir dövüşten çıkmanın yolu."
    simge: ENDER_PEARL
    beceri: avcilik
    sinif: avci
    gerekli-seviye: 10
    enerji: 15
    bekleme-suresi-saniye: 120
    etki-suresi-saniye: 5
    arac:
      tur: MELEE
    etki:
      tur: PHANTOM_STEP
    gorsel:
      renk: KOYU_MOR
      ses: ENTITY_ILLUSIONER_MIRROR_MOVE
      yanki-ses: BLOCK_AMETHYST_BLOCK_RESONATE
      ses-seviyesi: 0.9
      ton: 1.3
      partikul: SCULK_SOUL
      partikul-sayisi: 26
      sekil: SARMAL

  avci-odagi:
    gorunen-ad: "Avcı Odağı"
    aciklama: "Etkinken verdiğin PvE hasarı %50 artar (yalnızca yaratıklara karşı - PvP'de geçerli değildir). Her isabetli vuruşta enerji tüketir; enerjin biterse ya da en fazla 30 saniye sonra kendiliğinden sona erer."
    simge: IRON_SWORD
    beceri: avcilik
    sinif: avci
    gerekli-seviye: 20
    enerji: 25
    bekleme-suresi-saniye: 150
    etki-suresi-saniye: 30
    sure-modu: ENERJI
    enerji-vurus-basi: 16
    # Faz 21: MELEE = kilic YA DA balta. Baltayla oynayan bir savascidan
    # sinifinin kabiliyetlerini esirgemenin bir sebebi yoktu.
    arac:
      tur: MELEE
    etki:
      tur: DAMAGE_BUFF
      limit: 1
      hasar-carpani: 1.5
    gorsel:
      renk: KIRMIZI
      ses: ENTITY_PLAYER_ATTACK_SWEEP
      yanki-ses: ITEM_TRIDENT_RIPTIDE_1
      ses-seviyesi: 1.0
      ton: 0.7
      partikul: CRIT
      partikul-sayisi: 34
      sekil: SARMAL

  yikici-darbe:
    gorunen-ad: "Yıkıcı Darbe"
    aciklama: "Ayağının altında bir patlama yaratır: 5 blok yarıçapındaki tüm yaratıkları çok uzağa savurur ve ağır hasar verir. Sok dalgasi atildigi an biter."
    simge: TNT
    beceri: avcilik
    sinif: avci
    gerekli-seviye: 35
    enerji: 30
    # Faz 21: 4 dakika -> 30 saniye. Anlik biten bir kabiliyeti dort dakika
    # kilit altinda tutmak onu kullanilmaz yapiyordu.
    bekleme-suresi-saniye: 30
    # Isi zaten atildigi anda biter; 1 saniye yalnizca tozun oturmasi icin.
    etki-suresi-saniye: 1
    arac:
      tur: MELEE
    etki:
      tur: KNOCKBACK_SLAM
      yaricap: 5
      # KNOCKBACK_SLAM icin bu bir carpan degil, dogrudan verilen ham hasardir.
      hasar-carpani: 11.0
    # Patlama sesi/partikulu kabiliyetin kendi etkisinde zaten var; buradaki
    # ses onun uzerine binen "catlama" vurusudur.
    gorsel:
      renk: TURUNCU
      ses: BLOCK_ANVIL_LAND
      yanki-ses: ENTITY_DRAGON_FIREBALL_EXPLODE
      ses-seviyesi: 1.0
      ton: 0.6
      partikul: LARGE_SMOKE
      partikul-sayisi: 32
      sekil: HALKA

  kan-yemini:
    gorunen-ad: "Kan Yemini"
    aciklama: "45 saniye boyunca bir yaratığa verdiğin hasarın %15'i sana can olarak geri döner ve Hız 1 alırsın. Ekranının kenarları kızarır; yemin altındayken ölen her yaratığın ruhu sana akar. Sınıfın en güçlü kabiliyeti."
    simge: NETHERITE_SWORD
    beceri: avcilik
    sinif: avci
    gerekli-seviye: 50
    enerji: 40
    # Faz 21: 10 dakika -> 7,5 dakika.
    bekleme-suresi-saniye: 450
    etki-suresi-saniye: 45
    arac:
      tur: MELEE
    etki:
      tur: LIFE_STEAL
      # Verilen hasarin ne kadari cana donusur (0-1 arasi).
      can-orani: 0.15
      # Kabiliyet acikken verilen Hiz efektinin seviyesi (1 = Hiz 1).
      # Odak agacindaki "Kan Hizi" yetenegi bunu arttirir.
      hiz-seviyesi: 1
    gorsel:
      renk: KIRMIZI
      ses: ENTITY_WITHER_SHOOT
      yanki-ses: ENTITY_RAVAGER_ROAR
      ses-seviyesi: 1.0
      ton: 0.6
      partikul: DUST
      partikul-sayisi: 40
      sekil: KUBBE

  # =====================================================================
  #  Mağara Adamı (madenci) - sinerji: madencilik
  #  Bulldozer (10) -> Madenci Refleksleri (20) -> Kaya Patlaması (35) ->
  #  Maden Feneri (50)
  # =====================================================================
  bulldozer:
    gorunen-ad: "Bulldozer"
    aciklama: "Açması bedavadır. 1 dakika boyunca kazdığın HER blok, merkezinde durduğu 3x3x3 küple birlikte düşer. Her blok 3 enerji ve kazmandan 1 dayanıklılık götürür; enerjin biterse kabiliyet orada kapanır. Enerji kabiliyet açıkken hiç yenilenmez."
    simge: GOLDEN_PICKAXE
    beceri: madencilik
    sinif: madenci
    gerekli-seviye: 10
    # Faz 22: acilis bedeli 25 -> 0. Bulldozer'in gercek fiyati zaten blok basi
    # enerjisi; ustune bir de acilis bedeli almak, bir tunele girmeden once
    # barin dortte birini goturuyordu. Blok basi 3 enerji aynen duruyor.
    enerji: 0
    bekleme-suresi-saniye: 150
    # SUREKLI KABILIYET: ilk blokta tukenmez, 1 dakika acik kalir.
    etki-suresi-saniye: 60
    enerji-blok-basi: 3
    arac:
      tur: PICKAXE
    etki:
      tur: BULLDOZER
      # 1 = 3x3x3 kup (26 komsu blok), 2 = 5x5x5.
      yaricap: 1
    gorsel:
      renk: TURKUAZ
      ses: BLOCK_GRINDSTONE_USE
      yanki-ses: BLOCK_STONE_BREAK
      ses-seviyesi: 1.0
      ton: 0.7
      partikul: GLOW
      partikul-sayisi: 28
      sekil: SARMAL

  madenci-refleksleri:
    gorunen-ad: "Madenci Refleksleri"
    aciklama: "10 saniye boyunca elindeki kazmaya +3 Verimlilik ekler. Kazmanda zaten Verimlilik varsa üstüne biner (Verimlilik 3 kazma → Verimlilik 6). Süre dolunca kazman tam olduğu hâline döner."
    simge: IRON_PICKAXE
    beceri: madencilik
    sinif: madenci
    gerekli-seviye: 20
    # Tek seferde harcanir; blok basi bir bedeli yoktur.
    enerji: 30
    bekleme-suresi-saniye: 120
    etki-suresi-saniye: 10
    arac:
      tur: PICKAXE
    etki:
      tur: TOOL_EFFICIENCY
      # Kazmanin mevcut Verimlilik seviyesinin UZERINE eklenen seviye sayisi.
      # Odak agacindaki "Refleks Keskinligi" bunu arttirir.
      seviye: 3
    gorsel:
      renk: MAVI
      ses: BLOCK_ANVIL_USE
      yanki-ses: BLOCK_AMETHYST_BLOCK_CHIME
      ses-seviyesi: 1.0
      ton: 1.5
      partikul: ENCHANT
      partikul-sayisi: 34
      sekil: SARMAL

  kaya-patlamasi:
    gorunen-ad: "Kaya Patlaması"
    aciklama: "Bulunduğun yere bir Maden Bombası bırakır. Normal bir TNT'den 6 kat güçlü patlar ama hiçbir cevhere, oyuncuya veya yaratığa zarar vermez. Ortaya çıkan cevherler 5 saniye boyunca parlar ve kaç tane çıktığı sana yazılır."
    simge: TNT
    beceri: madencilik
    sinif: madenci
    gerekli-seviye: 35
    enerji: 35
    bekleme-suresi-saniye: 300
    # Bomba birakildigi an is biter; sure yalnizca fitilin yanmasi icin.
    etki-suresi-saniye: 5
    arac:
      tur: PICKAXE
    etki:
      tur: MINE_BOMB
      # Faz 22: yaricap 35 -> 7.
      #
      # Vanilla bir TNT tasta yaklasik 4 blokluk bir cukur acar. "Normal
      # TNT'den 6 kat guclu" demek 6 KATI HACIM demektir, yani yaricapin kup
      # koku 6 kadar buyumesi: 4 * ~1.82 = ~7 blok. Eski 35 blok bunun yerine
      # koca bir salon aciyordu ve hicbir TNT patlamasina benzemiyordu.
      #
      # Odak agacindaki "Patlama Alani" her rankta +1 blok ekler (rank 4'te 11).
      yaricap: 7
    gorsel:
      renk: KOYU_MOR
      ses: ENTITY_TNT_PRIMED
      yanki-ses: BLOCK_DEEPSLATE_BREAK
      ses-seviyesi: 1.0
      ton: 0.7
      partikul: DUST
      partikul-sayisi: 40
      sekil: HALKA

  maden-feneri:
    gorunen-ad: "Maden Feneri"
    aciklama: "Yalnızca geniş, üstü kapalı bir madende kullanılabilir: 36 blok yarıçapındaki tüm cevherler 40 saniye boyunca duvarların ardından bile parlar. Süre dolmadan kırdığın cevherin parıltısı anında söner. Sınıfın en güçlü kabiliyeti."
    simge: GLOWSTONE
    beceri: madencilik
    sinif: madenci
    gerekli-seviye: 50
    enerji: 30
    # Sinifin son kabiliyeti: 10 dakika bekleme.
    bekleme-suresi-saniye: 600
    etki-suresi-saniye: 40
    arac:
      tur: PICKAXE
    etki:
      tur: ORE_REVEAL
      yaricap: 36
      # Cevrendeki kupun en az bu kadari bos hava olmali; dar bir tunelde
      # kabiliyet calismaz, genis bir magara/maden salonunda calisir.
      acik-alan-orani: 0.30
    gorsel:
      renk: TURUNCU
      ses: BLOCK_BEACON_ACTIVATE
      yanki-ses: BLOCK_CONDUIT_ACTIVATE
      ses-seviyesi: 1.0
      ton: 1.4
      partikul: END_ROD
      partikul-sayisi: 36
      sekil: KUBBE
