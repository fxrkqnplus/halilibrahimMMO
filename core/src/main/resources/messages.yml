  odul-secildi: "<gold><simge:kutlama> Kalıcı ödülünü seçtin:</gold> <white><odul></white>"
  odul-bekliyor: "<yellow><simge:uyari> Önce prestij ödülünü seçmelisin.</yellow>"
  # Prestijin ikinci yarisi: elle tutulur bir sandik. Kalici odul kadar
  # zorunludur; kapi once kaliciyi, sonra bunu acar.
