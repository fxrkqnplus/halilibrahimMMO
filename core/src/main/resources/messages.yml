  # Kilitli bir gorev sekmesine tiklandiginda.
  baslangic-gerekli: "<red><simge:uyari> Önce Başlangıç Görevleri'ni bitirmelisin.</red> <gray>Günlük, haftalık ve kalıcı görevler o zaman açılır ve panele sabitlenebilir.</gray>"

# "/ev" ("/home") komutu - sinif seviyesi 15'te ya da ilk prestijde acilir.
ev:
  kullanim: "<gray>Kullanım: <white>/ev</white> (evine ışınlan) <dark_gray>|</dark_gray> <white>/ev ayarla <isim></white> <dark_gray>|</dark_gray> <white>/ev sil</white></gray>"
  ayarlandi: "<green><simge:tamam> Evin ayarlandı:</green> <white><ev></white>"
  isinlanildi: "<green><simge:ok> Evine ışınlandın:</green> <white><ev></white>"
  silindi: "<yellow>Evin silindi.</yellow>"
  ayarlanmadi: "<red>Henüz bir ev ayarlamadın.</red> <gray>/ev ayarla <isim> ile ayarlayabilirsin.</gray>"
