  egilim-dusus-7: "<red><simge:uyari> <oyuncu> ne yaptıysa ters gitti.</red> <gray>Kaybettiği saygınlık:</gray> <white><dusus></white> <dark_gray>•</dark_gray> <gray>kalan:</gray> <white><sayginlik></white>"

