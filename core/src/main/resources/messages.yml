  egilim-dusus-1: "<red><simge:uyari> <oyuncu> yerden yere çakılmaya devam ediyor!</red> <gray>Saygınlığı tamı tamına</gray> <white><dusus></white> <gray>puan düştü!</gray>"
  egilim-dusus-2: "<red><simge:uyari> <oyuncu> kendine gelmekte zorlanıyor.</red> <gray>Saygınlığını toparlaması için bir şeyler yapması lazım. Eksilen saygınlık puanı:</gray> <white><dusus></white>"
