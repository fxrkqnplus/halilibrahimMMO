  yasak-dunya: "<red><simge:uyari> Rastgele ışınlanma yalnızca normal dünyada çalışır.</red>"
  bulunamadi: "<red>Güvenli bir nokta bulunamadı. Lütfen tekrar dene.</red>"

# Sayginlik Puani - harcanmaz, yalnizca artar. Kilometre taslari hem oyuncuya
# ozel olarak hem de tum sunucuya duyurulur.
# Dunya bosslari. Her nadirligin kendi rengi ve kendi metni vardir - bir
# nadirligin rengini degistirmek icin yalnizca bu satirlari duzenlemek yeter.
#   isim-*  : bossun basinin ustunde yazan ad
#   dogus-* : boss haritada belirdiginde tum sunucuya giden duyuru
#   olum-*  : boss oldurulduğunde tum sunucuya giden duyuru
#   kafa-*  : bossun geride biraktigi kafanin uzerindeki ad
boss:
  isim-siradan: "<gray>[Sıradan]</gray> <white><isim></white>"
  isim-nadir: "<green>[Nadir]</green> <white><isim></white>"
  isim-epik: "<light_purple>[Epik]</light_purple> <white><isim></white>"
  isim-efsanevi: "<gold><bold>[Efsanevi]</bold></gold> <yellow><isim></yellow>"
  isim-mistik: "<gradient:#FF00E4:#00FFFF><bold>[Mistik]</bold></gradient> <aqua><isim></aqua>"
  # Doguş duyurusu tüm sunucuya gider. <x>/<y>/<z> koordinatlar, <dunya>
  # dünyanın adıdır - herkesin bossa doğru yola çıkabilmesi için buradadır.
  dogus-siradan: "<gray><simge:boss> Sıradan bir boss belirdi:</gray> <white><isim></white> <dark_gray>•</dark_gray> <gray>Koordinat:</gray> <white><x>, <y>, <z></white>"
  dogus-nadir: "<green><simge:boss> Nadir bir boss belirdi:</green> <white><isim></white> <dark_gray>•</dark_gray> <gray>Koordinat:</gray> <white><x>, <y>, <z></white>"
  dogus-epik: "<light_purple><simge:boss> Epik bir boss belirdi:</light_purple> <white><isim></white> <dark_gray>•</dark_gray> <gray>Koordinat:</gray> <white><x>, <y>, <z></white>"
  dogus-efsanevi: "<gold><bold><simge:boss> EFSANEVİ BİR BOSS BELİRDİ:</bold></gold> <yellow><isim></yellow> <dark_gray>•</dark_gray> <gray>Koordinat:</gray> <white><x>, <y>, <z></white>"
  dogus-mistik: "<gradient:#FF00E4:#00FFFF><bold><simge:boss> MİSTİK BİR BOSS BELİRDİ:</bold></gradient> <aqua><isim></aqua> <dark_gray>•</dark_gray> <gray>Koordinat:</gray> <white><x>, <y>, <z></white>"
  # Yalnizca Efsanevi ve Mistik dogus, ekranin ortasina bir baslik olarak da
  # gelir. Digerleri sadece sohbete duyurulur: yarim saatte bir gelen bir
  # boss icin ekrani kesmek duyuru olmaktan cikip rahatsizliga donusurdu.
  baslik-efsanevi: "<gold><bold>EFSANEVİ BOSS</bold></gold>"
  altbaslik-efsanevi: "<yellow><isim></yellow> <gray>•</gray> <white><x>, <y>, <z></white>"
  baslik-mistik: "<gradient:#FF00E4:#00FFFF><bold>MİSTİK BOSS</bold></gradient>"
  altbaslik-mistik: "<aqua><isim></aqua> <gray>•</gray> <white><x>, <y>, <z></white>"
  # Ekranin ustundeki can cubugu. Bossa 96 blok mesafedeki herkes gorur.
  # <can>/<maksimum> anlik can, parantez icindeki de nadirliktir.
  cubuk-siradan: "<gray><simge:boss> <isim></gray> <dark_gray>|</dark_gray> <white><can></white><gray>/</gray><white><maksimum></white> <gray>(Sıradan)</gray>"
  cubuk-nadir: "<green><simge:boss> <isim></green> <dark_gray>|</dark_gray> <white><can></white><gray>/</gray><white><maksimum></white> <green>(Nadir)</green>"
  cubuk-epik: "<light_purple><simge:boss> <isim></light_purple> <dark_gray>|</dark_gray> <white><can></white><gray>/</gray><white><maksimum></white> <light_purple>(Epik)</light_purple>"
  cubuk-efsanevi: "<gold><bold><simge:boss> <isim></bold></gold> <dark_gray>|</dark_gray> <white><can></white><gray>/</gray><white><maksimum></white> <gold>(Efsanevi)</gold>"
  cubuk-mistik: "<gradient:#FF00E4:#00FFFF><bold><simge:boss> <isim></bold></gradient> <dark_gray>|</dark_gray> <white><can></white><gray>/</gray><white><maksimum></white> <aqua>(Mistik)</aqua>"
  olum-siradan: "<gray><simge:tamam> <oyuncu>, <isim> adlı bossu öldürdü.</gray>"
  olum-nadir: "<green><simge:tamam> <oyuncu>, <isim> adlı nadir bossu öldürdü!</green>"
  olum-epik: "<light_purple><simge:tamam> <oyuncu>, <isim> adlı epik bossu öldürdü!</light_purple>"
  olum-efsanevi: "<gold><bold><simge:kutlama> <oyuncu>, EFSANEVİ <isim> bossunu öldürdü!</bold></gold>"
  olum-mistik: "<gradient:#FF00E4:#00FFFF><bold><simge:kutlama> <oyuncu>, MİSTİK <isim> bossunu öldürdü!</bold></gradient>"
  kafa-siradan: "<gray><isim>'nin Kafası</gray>"
  kafa-nadir: "<green><isim>'nin Kafası</green>"
  kafa-epik: "<light_purple><isim>'nin Kafası</light_purple>"
  kafa-efsanevi: "<gold><isim>'nin Kafası</gold>"
  kafa-mistik: "<gradient:#FF00E4:#00FFFF><isim>'nin Kafası</gradient>"
  # Kafanin uzerindeki aciklama satiri: bu bossu kimin dusurdugu. Bir kupa,
  # kimin kazandigini soylemedigi surece yalnizca bir esyadir.
  kafa-olduren: "<gray>Öldüren: <white><oyuncu></white></gray>"
  # Boss bir lav birikintisine dustuyse ya da baska bir yaratik onu bitirdiyse
  # yazacak bir isim yoktur; kafa yine de duser.
  kafa-sahipsiz: "<dark_gray>Öldüren: bilinmiyor</dark_gray>"
  # ----- Xaero's Minimap harita noktası -----
  # Bu satır sohbete gönderilir ama Xaero's Minimap onu yakalayıp haritaya bir
  # işaret koyar. BİÇİMİ BOZMAYIN: mod, mesajın tamamını kendi kalıbıyla
  # eşleştirir, araya eklenen tek bir kelime bile işareti kaybettirir.
  #   <kisaltma> haritada görünen 2 harflik etiket (bossun baş harfleri)
  #   <renk>     0-15 arası Minecraft renk numarası (nadirliğe göre)
  #   <x>/<y>/<z> bossun koordinatları
  # Xaero's Minimap zorunlu mod listesinde olduğu için hiçbir oyuncu bu satırı
  # ham metin olarak görmez. Modu zorunlu olmaktan çıkarırsanız bu satırı boş
  # bırakmanız yeterlidir; sunucu tarafında başka hiçbir şey değişmez.
  harita-noktasi: "xaero-waypoint:<isim>:<kisaltma>:<x>:<y>:<z>:<renk>:false:0:gui.xaero_default"

sayginlik:
  kilometre-tasi: "<blue><simge:sayginlik> Saygınlık kilometre taşı!</blue> <gray>Toplam puanın:</gray> <white><sayginlik></white>"
  kilometre-tasi-duyuru: "<blue><bold><simge:sayginlik> <oyuncu> <esik> saygınlık puanına ulaştı!</bold></blue>"
  # ----- Saygınlık sıralaması duyuruları -----
  # Bunlar "siralama-duyuru-araligi-dakika" (sayginlik.yml) periyoduyla, her
  # turda EN FAZLA BİR TANE olmak üzere tüm sunucuya gider. İki çeşit vardır:
  #   siralama-gecis-*   : bir oyuncu tam olarak bir kişiyi geçti.
  #                        <oyuncu> yükselen, <rakip> geçilen kişi,
  #                        <sira> yeni sıra, <sayginlik> yeni puan.
  #   siralama-yukselis-*: bir oyuncu birkaç basamak birden tırmandı.
  #                        <basamak> kaç sıra yükseldiği.
  # Aynı cümlenin sürekli tekrarlanmaması için her turda rastgele biri seçilir;
  # istediğiniz kadarını kendi üslubunuzla değiştirebilirsiniz.
  siralama-gecis-1: "<blue><simge:sayginlik> <oyuncu> aman tanımıyor!</blue> <gray><rakip>, <oyuncu> adlı oyuncunun gölgesinde kalarak <sira>. sıraya düştü.</gray>"
  siralama-gecis-2: "<blue><simge:sayginlik> <oyuncu>, <rakip> adlı oyuncuyu geride bıraktı</blue> <gray>ve saygınlıkta <sira>. sıraya yerleşti.</gray>"
  siralama-gecis-3: "<blue><simge:sayginlik> Sıralama değişti:</blue> <white><oyuncu></white> <gray><rakip> adlı oyuncunun yerini aldı ve artık <sira>. sırada.</gray>"
  siralama-gecis-4: "<blue><simge:sayginlik> <oyuncu> kervanı çevirdi!</blue> <gray><rakip> bir basamak geriledi, <sira>. sıra artık <oyuncu> adlı oyuncunun.</gray>"
  siralama-gecis-5: "<blue><simge:sayginlik> <rakip> arkasına baktığında <oyuncu> adlı oyuncuyu göremedi</blue> <gray>- çünkü çoktan önüne geçmişti. Yeni sıra: <sira>.</gray>"
  siralama-gecis-6: "<blue><simge:sayginlik> <oyuncu>, <rakip> adlı oyuncunun servetini aştı</blue> <gray>ve <sayginlik> puanla <sira>. sıraya çıktı.</gray>"
  siralama-gecis-7: "<blue><simge:sayginlik> El değiştirdi!</blue> <gray><sira>. sıra artık <oyuncu> adlı oyuncunun; <rakip> bir basamak aşağıda.</gray>"
  siralama-gecis-8: "<blue><simge:sayginlik> <oyuncu> sessiz sedasız çalıştı</blue> <gray>ve <rakip> adlı oyuncuyu geçerek <sira>. sıraya oturdu.</gray>"
  siralama-yukselis-1: "<blue><simge:sayginlik> <oyuncu> önünde engel tanımıyor!</blue> <gray>Yükselişlerinin ardı arkası kesilmeyerek saygınlıkta <sira>. sıraya ulaştı.</gray>"
  siralama-yukselis-2: "<blue><simge:sayginlik> <oyuncu> tek turda <basamak> basamak birden tırmandı</blue> <gray>ve <sira>. sıraya yerleşti.</gray>"
  siralama-yukselis-3: "<blue><simge:sayginlik> Kimse <oyuncu> adlı oyuncuyu durduramıyor:</blue> <gray><basamak> sıra birden yükselerek <sira>. sıraya çıktı.</gray>"
  siralama-yukselis-4: "<blue><simge:sayginlik> <oyuncu> merdivenleri ikişer ikişer çıkıyor!</blue> <gray><basamak> basamak yükseldi, artık <sira>. sırada.</gray>"
  siralama-yukselis-5: "<blue><simge:sayginlik> <oyuncu> adlı oyuncunun serveti <sayginlik> puana ulaştı</blue> <gray>ve <basamak> sıra birden atlayarak <sira>. sıraya geldi.</gray>"
  siralama-yukselis-6: "<blue><simge:sayginlik> Tablo <oyuncu> yüzünden yeniden yazıldı:</blue> <gray><basamak> basamak yukarı, doğruca <sira>. sıraya.</gray>"
  siralama-yukselis-7: "<blue><simge:sayginlik> <oyuncu> nefes almadan çalışıyor</blue> <gray>- <basamak> sıra yükselip <sira>. sıraya kuruldu.</gray>"
  # ----- Ölüm cezası -----
  # Ölmek saygınlığa mal olur ve bedel, ölmeden ÖNCEKİ puana göre belirlenir.
  # Bu üç satır yalnızca ölen oyuncunun KENDİ sohbetine gider; kimse başkasının
  # kaybını görmez - ölüm zaten yeterince kötü bir an.
  #   <kayip>     kaybedilen puan (kısaltılmış: 2.5K, 1.05M)
  #   <sayginlik> kayıptan SONRA kalan toplam
  # Sebep başına ayrı şablon, çünkü ceza da sebebe göre değişiyor: kendi
  # hatanla ölmek en ucuz, bir oyuncunun elinden ölmek en pahalıdır.
