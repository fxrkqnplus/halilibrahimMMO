  dogus-efsanevi: "<gold><bold><simge:boss> EFSANEVİ BİR BOSS BELİRDİ:</bold></gold> <yellow><isim></yellow> <dark_gray>•</dark_gray> <gray>Koordinat:</gray> <white><x>, <y>, <z></white>"
