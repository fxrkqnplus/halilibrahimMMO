# =====================================================================
#  HalilIbrahimMMO - Mesaj Dosyası
# =====================================================================
#  Tüm metinler MiniMessage biçimindedir: <renk>, <gradient>, <bold> gibi
#  etiketler kullanabilirsiniz. Detaylı biçimlendirme rehberi için:
#  https://docs.advntr.dev/minimessage/format.html
#
#  <köşeli parantez içindeki> kelimeler yer tutucudur (placeholder), silmeyin.
#
#  SUNUCU İKON PAKETİ: <simge:ad> yazarak sunucuya özel ikonlardan birini
#  ekleyebilirsiniz. İkonun rengi yoktur - etrafındaki renk etiketi neyse
#  onu alır. Kullanılabilir adlar:
#    guc prestij sinif seviye xp kabiliyet enerji can gorev koleksiyon
#    gunluk liderlik unvan kozmetik madencilik odunculuk kazicilik avcilik
#    tarimcilik hayvancilik tamam eksik ok uyari bilgi kutlama saygınlık boss
#  Örnek: "<gold><simge:guc> Güç:</gold> <white><seviye></white>"
#
#  Bu dosyayı değiştirdikten sonra /haliladmin panelindeki "Yeniden Yükle"
#  düğmesiyle anında uygulayabilirsiniz; sunucuyu yeniden başlatmanıza gerek yoktur.
# =====================================================================

# Her mesajın başına otomatik olarak eklenen eklenti öneki.
onek: "<gradient:#7C3AED:#3B82F6><simge:kutlama> HalilIbrahimMMO</gradient> <dark_gray>»</dark_gray> "

genel:
  yetkisiz: "<red>Bu komutu kullanmak için yetkiniz yok.</red>"
  sadece-oyuncu: "<red>Bu komut yalnızca oyuncular tarafından kullanılabilir.</red>"
  # Bir ayarin acik/kapali oldugunu yazan ekranlar bu iki kelimeyi kullanir.
  # Rengi yoktur: cagiran sablon neyse onu alir.
  evet: "Evet"
  hayir: "Hayır"

# ----- Bulut sandigi (/canta) -----
# Icerik veritabaninda durur, oyuncunun envanterinde degil - bu yuzden olum,
# lav ya da bir hirsiz ona ulasamaz. Her biyomda, her dunyada acilabilir.
canta:
  baslik: "<dark_aqua>Bulut Sandığı</dark_aqua>"
  kilitli: "<red><simge:uyari> Bulut sandığı <white><seviye>. sınıf seviyesinde</white> açılır.</red> <gray>(Prestij yaptıysan seviyeden bağımsız olarak zaten açıktır.)</gray>"
  # Sandik HER acildiginda gorunur, bu yuzden kasitli olarak tek kelimelik:
  # anlatinin tamami uzerine gelindiginde cikan ipucuna tasindi. Iki satirlik
  # bir aciklamayi gunde otuz kere okumak bilgi degil gurultudur.
  acildi: "<hover:show_text:'<gray>İçindekiler ölümde kaybolmaz.<newline>Pencereyi kapattığında kaydedilir.<newline><dark_gray>Kapasite: <white><kapasite></white> slot</dark_gray>'><aqua><simge:koleksiyon> Bulut Sandığı</aqua></hover>"
  # Sandik 18 slotla acilir; iki genisletmenin her biri +7 slot verir (18 -> 25
  # -> 32). Minecraft 25 slotluk bir sandik yapamadigi icin pencere her zaman
  # tam satirdir ve satin alinmamis slotlar bu panelle kapatilir.
  kilitli-slot: "<red>Kilitli Slot</red>"
  kilitli-slot-aciklama: "<gray>Odak ağacından <white>+<slot> slot</white> satın alarak açılır.</gray>"
  genisletildi: "<green><simge:kutlama> Bulut sandığın genişledi!</green> <gray>Yeni kapasite:</gray> <white><kapasite></white> <gray>slot.</gray>"
  genisletme-dolu: "<yellow>Bulut sandığın zaten en geniş hâlinde.</yellow>"
  genisletme-puan-yok: "<red>Bunun için bir özellik puanına ihtiyacın var.</red>"

# Ekranda gorunen HER sure bu dort parcadan birlestirilir: once gun, sonra
# saat, dakika ve saniye - sifir olan birimler hic yazilmaz. Ornegin 130
# saniye "2 dakika 10 saniye" olarak gosterilir. Buradaki metinler baska
# mesajlarin icine duz metin olarak yerlestirildigi icin renk/etiket
# kullanmayin, sadece sayi (<deger>) ve birim adi yazin.
sure:
  gun: "<deger> gün"
  saat: "<deger> saat"
  dakika: "<deger> dakika"
  saniye: "<deger> saniye"

# "/haliladmin" yonetici panelinin sohbete gonderdigi onay mesajlari.
yonetici:
  yenile-basarili: "<green>Yapılandırma ve mesajlar başarıyla yeniden yüklendi.</green>"
  yenile-basarisiz: "<red>Yeniden yükleme sırasında bir hata oluştu. Sunucu konsolunu kontrol edin.</red>"
  versiyon: "<yellow>HalilIbrahimMMO</yellow> <gray>sürüm</gray> <white><surum></white> <dark_gray>|</dark_gray> <gray>Paper <white><paper_surumu></white> için geliştirildi.</gray>"
  debug-acildi: "<green>Hata ayıklama modu <white>açıldı</white>.</green>"
  debug-kapatildi: "<yellow>Hata ayıklama modu <white>kapatıldı</white>.</yellow>"
  boss-cagirildi: "<gold><simge:boss> Dünya bossu çağırıldı:</gold> <white><isim></white> <gray>(koordinatlar sohbete duyuruldu)</gray>"
  boss-oyuncu-yok: "<red>Boss çağırmak için normal dünyada en az bir oyuncu çevrimiçi olmalı.</red>"
  # Boss cagirma ekranindaki isim akisi. Isim yalnizca bir sonraki cagirma
  # icin gecerlidir; ekran kapaninca unutulur.
  boss-isim-sorusu: "<gold><simge:boss> Bossun adını sohbete yaz.</gold> <gray>En fazla 32 karakter. Vazgeçmek için <white>iptal</white> yaz.</gray>"
  boss-isim-ayarlandi: "<green><simge:tamam> Bir sonraki boss <white><isim></white> adıyla çağırılacak.</green>"
  boss-isim-gecersiz: "<red>Geçersiz isim. En az 1, en fazla 32 karakter olmalı.</red>"
  # Yonetici panelinden saygınlık ayarlama akisi: dugmeye tiklaninca ekran
  # kapanir, admin sohbete sayiyi yazar. Bu, tikla-arttir satirlarinin
  # yetmedigi tek alan (saygınlık totalleri milyonlara ciker).
  sayginlik-sor: "<gold><simge:sayginlik> Yeni saygınlık puanını sohbete yaz.</gold> <gray>Sadece sayı, örn: <white>250000</white></gray>"
  sayginlik-ayarlandi: "<green><simge:tamam> <oyuncu> oyuncusunun saygınlığı <white><sayginlik></white> olarak ayarlandı.</green>"
  sayginlik-gecersiz: "<red>Bu bir sayı değil:</red> <white><deger></white>"
  oyuncu:
    bilgi: "<gold><oyuncu></gold> <dark_gray>•</dark_gray> <gray>Güç:</gray> <white><seviye></white> <dark_gray>|</dark_gray> <gray>Prestij:</gray> <white><prestij></white> <dark_gray>|</dark_gray> <gray>Sınıf:</gray> <white><sinif></white> <dark_gray>|</dark_gray> <gray>Beceriler:</gray> <white><beceriler></white>"
    bilgi-sinifsiz: "<gold><oyuncu></gold> <dark_gray>•</dark_gray> <gray>Güç:</gray> <white><seviye></white> <dark_gray>|</dark_gray> <gray>Prestij:</gray> <white><prestij></white> <dark_gray>|</dark_gray> <gray>Sınıf:</gray> <white>Seçilmedi</white> <dark_gray>|</dark_gray> <gray>Beceriler:</gray> <white><beceriler></white>"

# Bir arayuz oyuncudan sohbete tek satir yazmasini istediginde kullanilir
# (su an yalnizca yonetici panelindeki saygınlık alani). Yazilan satir
# sohbete DUSMEZ, dogrudan arayuze gider.
sohbet-giris:
  iptal-ipucu: "<gray>Vazgeçmek için <white>iptal</white> yaz.</gray>"
  iptal-edildi: "<yellow>İşlem iptal edildi.</yellow>"
  suresi-doldu: "<red>Çok geç kaldın, soru zaman aşımına uğradı.</red>"

# "/mmo" komutuna ait mesajlar (aktivasyon akisi).
mmo:
  zaten-aktif: "<yellow>MMO sistemini zaten aktifleştirdin.</yellow>"
  aktiflestirildi: "<green>MMO sistemi aktifleştirildi! Şimdi bir sınıf seçeceksin.</green>"

# Ekranın sağındaki kalıcı profil bilgi ekranı (scoreboard).
#
# NOT: Minecraft'ın kendisi bu panelde en fazla 15 satır gösterir. Eklenti
# fazlasını kırpar (en alttaki "/panel ile aç/kapat" satırı her zaman kalır),
# bu yüzden satırları kısa tutmak ve gereksiz satır eklememek önemlidir.
sidebar:
  baslik: "<gradient:#7C3AED:#3B82F6><bold><simge:kutlama> HalilIbrahimMMO</bold></gradient>"
  oyuncu: "<gray>Oyuncu:</gray> <white><oyuncu></white>"
  oyuncu-etiket: "<gray>Oyuncu:</gray> "
  sinif-yok: "<gray><simge:sinif> Sınıf:</gray> <white>Seçilmedi</white>"
  # Güç, prestij ve saygınlık tek satırı paylaşır: panelde toplam 15 satır var
  # ve bu üç sayı zaten birlikte okunuyor.
  guc: "<gray><simge:guc></gray> <gold><seviye></gold> <dark_gray>|</dark_gray> <gray><simge:prestij></gray> <light_purple><prestij></light_purple> <dark_gray>|</dark_gray> <gray><simge:sayginlik></gray> <blue><sayginlik></blue>"
  aktivasyon-onerisi: "<yellow><simge:ok> Başlamak için /mmo aktif yaz!</yellow>"
  sinif-onerisi: "<yellow><simge:ok> Sınıf seçmek için /sınıf yaz!</yellow>"
  sinif-seviye: "<aqua><simge:sinif> <sinif></aqua> <gray>Sv.</gray><aqua><seviye></aqua> <dark_gray>(<xp>/<gereken>)</dark_gray>"
  aktif-kabiliyet: "<gold><simge:kabiliyet> <kabiliyet></gold> <dark_gray>(<kalan>)</dark_gray>"
  kabiliyet-secili: "<green><simge:kabiliyet> <kabiliyet></green> <dark_gray>hazır</dark_gray>"
  kabiliyet-yok: "<dark_gray><simge:kabiliyet> Kabiliyet seçilmedi</dark_gray>"
  ozellikler: "<gray><simge:bilgi> Ev:</gray> <white><ev></white> <dark_gray>|</dark_gray> <gray>Takas:</gray> <white><takas></white> <dark_gray>|</dark_gray> <gray>Çanta:</gray> <white><canta></white>"
  ozellik-acik: "Açık"
  ozellik-kilitli: "Kilitli"
  ozellik-ayarsiz: "Ayarlanmadı"
  takas-acik: "<yellow><simge:koleksiyon> Takas açık:</yellow> <white><oyuncu></white>"
  # HER GOREV TURUNUN KENDI BASLIGI VAR. Baslik, altindaki girislerle ayni
  # renktedir - boylece renk ve baslik ayni seyi soyler, birbiriyle celismez.
  #
  # Panel 15 satirla sinirlidir. Yer kalmazsa once ayraclar ve /panel alt
  # bilgisi, sonra EN ALTTAKI BASLIK atilir; bir gorev satiri en son gider.
  # Yani cok gorev sabitleyen bir oyuncu bir basligi kaybedebilir ama gorevi
  # asla kaybetmez.
  #
  # Kalici gorevler panelde yalnizca oyuncunun /görev ekranindan sabitledigi
  # gorevlerden olusur - onlarcasi var, hepsini listelemek mumkun degil.
  gorev-baslik-gunluk: "<yellow><simge:gorev> Günlük Görevler</yellow>"
  gorev-baslik-haftalik: "<gold><simge:gorev> Haftalık Görevler</gold>"
  gorev-baslik-kalici: "<aqua><simge:gorev> Kalıcı Görevler</aqua>"
  gorev-gunluk: "<yellow>• <gorev>:</yellow> <white><ilerleme></white> <dark_gray>(+<xp>)</dark_gray>"
  gorev-gunluk-tamam: "<green>• <simge:tamam> <gorev></green> <dark_gray>(+<xp>)</dark_gray>"
  gorev-haftalik: "<gold>• <gorev>:</gold> <white><ilerleme></white> <dark_gray>(+<xp>)</dark_gray>"
  gorev-haftalik-tamam: "<green>• <simge:tamam> <gorev></green> <dark_gray>(+<xp>)</dark_gray>"
  gorev-kalici: "<aqua>• <gorev>:</aqua> <white><ilerleme></white> <dark_gray>(+<xp>)</dark_gray>"
  gorev-kalici-tamam: "<green>• <simge:tamam> <gorev></green> <dark_gray>(+<xp>)</dark_gray>"
  alt-bilgi: "<dark_gray>/panel ile aç/kapat</dark_gray>"
  onboarding-baslik: "<yellow><simge:bilgi> Başlangıç Görevleri:</yellow>"
  onboarding-menu: "<gray>• /menü ile ana menüyü aç</gray>"
  onboarding-beceri: "<gray>• Becerilerini incele</gray>"
  onboarding-kabiliyet: "<gray>• Kabiliyetlerini incele</gray>"
  onboarding-beceri-komutu: "<gray>• Beceri komutlarını incele (/madencilik, /avcılık vb.)</gray>"

# "/profil <oyuncu>" ile aranan oyuncu hicbir kayitta bulunamadiginda.
profil:
  oyuncu-bulunamadi: "<red>Böyle bir oyuncu bulunamadı:</red> <white><oyuncu></white>"

# "/panel" komutuna ait mesajlar.
panel:
  acildi: "<green>Bilgi ekranı açıldı.</green>"
  kapatildi: "<yellow>Bilgi ekranı kapatıldı.</yellow>"

# Tek bir oyuncu yatakta geceyi tamamladiginda o dunyadaki herkese gider.
# Acilip kapanmasi sunucu.yml -> uyku.duyuru-yapilsin ile yonetilir.
uyku:
  gece-atlandi: "<aqua><simge:bilgi> <oyuncu> geceyi devirdi.</aqua> <gray>Herkese hayırlı sabahlar!</gray>"

# "/harita" ("/map") komutu.
# NOT: Adres iki yerde birden geçer - biri tıklanan bağlantı (click:open_url
# etiketinin içi), digeri ekranda okunan metin. Adresi degistirirken İKİSİNİ
# birden degistirin. Yer tutucu kullanilamaz: MiniMessage etiket argumanlari
# duz metin olmak zorundadir.
harita:
  link: "<green><simge:liderlik> Canlı oyuniçi harita linki:</green> <click:open_url:'https://harita.fxrkqn.org:8100'><aqua><underlined>https://harita.fxrkqn.org:8100</underlined></aqua></click> <gray>(tıkla)</gray>"

# =====================================================================
#  TAB listesi (TAB tuşuna basılı tutulduğunda görünen ekran)
# =====================================================================
#  Başlık ve alt bilgi <newline> ile satırlara ayrılır.
#  Yer tutucular: <cevrimici> <maksimum> <tps> <ping>
#  Alt bilgi üç ayrı satırdır ve hangisinin kullanılacağını sunucunun anlık
#  TPS'i belirler: 19+ sağlıklı, 15-19 yoğun, 15 altı yavaş. Renkleri
#  buradan değiştirebilirsiniz.
#  Sunucu adı ve adresi doğrudan aşağıdaki metinlerin içindedir.
tab:
  baslik: "<newline><gradient:#7C3AED:#3B82F6><bold><simge:kutlama> HALİL İBRAHİM SOFRASI</bold></gradient><newline><gray>Beceri odaklı hayatta kalma sunucusu.</gray><newline><dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray><newline><gray>Çevrimiçi:</gray> <white><cevrimici></white><dark_gray>/</dark_gray><gray><maksimum></gray>"
  altbilgi-saglikli: "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray><newline><gray>TPS:</gray> <green><tps></green> <dark_gray>|</dark_gray> <gray>Ping:</gray> <green><ping> ms</green><newline><yellow><bold>oyna.fxrkqn.org</bold></yellow><newline><gray>Canlı harita:</gray> <aqua>/harita</aqua><newline>"
  altbilgi-yogun: "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray><newline><gray>TPS:</gray> <yellow><tps></yellow> <dark_gray>|</dark_gray> <gray>Ping:</gray> <yellow><ping> ms</yellow><newline><yellow><bold>oyna.fxrkqn.org</bold></yellow><newline><gray>Canlı harita:</gray> <aqua>/harita</aqua><newline>"
  altbilgi-yavas: "<dark_gray>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</dark_gray><newline><gray>TPS:</gray> <red><tps></red> <dark_gray>|</dark_gray> <gray>Ping:</gray> <red><ping> ms</red><newline><yellow><bold>oyna.fxrkqn.org</bold></yellow><newline><gray>Canlı harita:</gray> <aqua>/harita</aqua><newline>"
  # Oyuncu satiri. Unvani olan oyuncularda bu metnin ONUNE, unvanin kendi
  # renginde bir "[Unvan] " etiketi eklenir - o etiket koddan uretilir, cunku
  # her unvanin rengi titles.yml'de kendine aittir.
  oyuncu: "<white><oyuncu></white> <dark_gray>|</dark_gray> <gold><simge:guc> <guc></gold>"

enerji:
  durum: "<aqua><simge:enerji> Enerji:</aqua> <white><mevcut></white><gray>/</gray><white><maksimum></white> <bar>"
  # Kabiliyet kapandiktan sonra bar dolarken gorunur. Kabiliyet ACIKKEN enerji
  # hic yenilenmez, dolayisiyla bu satir yalnizca "simdi doluyor" demektir -
  # oyuncunun bir sonraki kullanima ne kadar kaldigini gordugu tek yer.
  yenileniyor: "<aqua><simge:enerji> Enerji yenileniyor:</aqua> <white><mevcut></white><gray>/</gray><white><maksimum></white> <dark_gray>•</dark_gray> <gray>saniyede <white><hiz></white></gray> <bar>"

kabiliyet:
  bilinmeyen: "<red>Bilinmeyen kabiliyet:</red> <white><kabiliyet></white>"
  kilitli: "<red><kabiliyet> için <seviye>. sınıf seviyesine ulaşmalısın.</red>"
  yetersiz-enerji: "<red><kabiliyet> için yeterli enerjin yok.</red> <gray>Gereken: <gereken>, mevcut: <mevcut></gray>"
  bekleme: "<yellow><kabiliyet> yeniden kullanılabilir olmadan önce <sure> beklemelisin.</yellow>"
  # Bekleme suresi dolmamisken sag tiklandiginda eylem cubugunda gorunur;
  # sohbete hicbir sey gitmez, cunku bu tiklama cogunlukla kaza eseridir.
  bekleme-eylem-cubugu: "<yellow><simge:kabiliyet> <kabiliyet></yellow> <dark_gray>•</dark_gray> <gray>Hazır olmasına <white><sure></white> var</gray> <bar>"
  enerji-bitti: "<yellow><simge:enerji> Enerjin tükendi,</yellow> <white><kabiliyet></white> <gray><sayi> blokta sona erdi.</gray>"
  # Cagriya cevap veren butun hayvanlar dustugunde kabiliyet kendiliginden biter.
  koruyucu-dustu: "<red><simge:uyari> Bütün koruyucuların düştü;</red> <white><kabiliyet></white> <gray>sona erdi.</gray>"
  # Bir koruyucunun kalpleri enerjinle doldugu an. <hayvan> yaratigin KENDI
  # cevrilmis adidir (istemci kendi dilinde gosterir), bu yuzden burada hayvan
  # ismi listesi tutulmaz - Minecraft yeni bir hayvan eklerse kendiliginden
  # dogru yazar.
  koruyucu-iyilestirildi: "<green><simge:can> <hayvan> <white>+<kalp></white> kalp iyileşti.</green> <gray>(-<enerji> Enerji)</gray>"
  kuruldu: "<green><kabiliyet> kuruldu.</green> <gray><sure> içinde uygun bir blok kır.</gray>"
  etkin: "<green><kabiliyet> etkin.</green> <gray><sure> boyunca PvE hasarın güçlendi.</gray>"
  etkin-genel: "<green><kabiliyet> etkin.</green> <gray><sure> sürecek.</gray>"
  etkin-sans: "<green><kabiliyet> etkin.</green> <gray><sure> boyunca kırdığın bloklardan ekstra düşme şansın var.</gray>"
  etkin-cevher: "<green><simge:madencilik> <kabiliyet> etkin.</green> <gray>Çevrendeki <white><sayi></white> cevher <sure> boyunca parlıyor.</gray>"
  etkin-filiz: "<green><simge:tarimcilik> <kabiliyet> etkin.</green> <gray>Çevrendeki <white><sayi></white> ekin bir anda olgunlaştı.</gray>"
  etkin-suru: "<green><simge:hayvancilik> <kabiliyet> etkin.</green> <gray>Çevrendeki <white><sayi></white> hayvan çağrına karşılık verdi.</gray>"
  etkin-kan: "<dark_red><simge:can> <kabiliyet> etkin.</dark_red> <gray><sure> boyunca yaratıklara verdiğin hasarın <white>%<yuzde></white> kadarı cana dönüşüyor.</gray>"
  etkin-bomba: "<dark_purple><simge:madencilik> <kabiliyet> yerleştirildi.</dark_purple> <gray>Fitil yanıyor - <white><yaricap> blok</white> yarıçapındaki kaya temizlenecek, cevherler yerinde kalacak. Uzaklaşmana gerek yok, sana zarar vermez.</gray>"
  etkin-refleks: "<aqua><simge:madencilik> <kabiliyet> etkin.</aqua> <gray><sure> boyunca kazman <white>+<seviye> Verimlilik</white> kazandı.</gray>"
  etkin-b-plani: "<dark_gray><simge:kabiliyet> <kabiliyet> etkin.</dark_gray> <gray><sure> boyunca hiçbir yaratık seni göremez.</gray>"
  etkin-koruyucular: "<green><simge:hayvancilik> <kabiliyet> etkin.</green> <gray><white><sayi></white> hayvan çağrına koştu; <sure> boyunca seni koruyacaklar.</gray>"
  # Maden Bombasi'nin kendi ismi (yerdeki TNT'nin ustunde gorunur).
  maden-bombasi-adi: "<dark_purple><bold>Maden Bombası</bold></dark_purple>"
  maden-bombasi-sonuc: "<dark_purple><simge:madencilik> Maden Bombası patladı.</dark_purple> <gray><white><blok></white> blok temizlendi, <white><sayi></white> cevher ortaya çıktı ve 5 saniye boyunca parlıyor.</gray>"
  maden-gerekli: "<red><simge:uyari> <kabiliyet> yalnızca geniş, üstü kapalı bir madende kullanılabilir.</red>"
  hayvan-gerekli: "<red><simge:uyari> <kabiliyet> için çevrende çağırabileceğin bir hayvan olmalı.</red>"
  gece-gerekli: "<red><simge:uyari> <kabiliyet> yalnızca geceleri çağrılabilir.</red> <gray>Gün batımını bekle.</gray>"
  etkin-asil-kurt: "<dark_red><bold><simge:kabiliyet> <kabiliyet></bold></dark_red> <gray>uyandı.</gray> <white><sure></white> <gray>boyunca zırh giyemezsin; canavarlar sana yaklaşmaz, kurtlar seninle avlanır, geri kalan her şey kaçar.</gray>"
  olumle-bitti: "<yellow><simge:uyari> Öldün;</yellow> <gray>çalışan kabiliyetin sona erdi. Kuşandığın kabiliyet üzerinde kalır.</gray>"
  # ----- Kombo merdiveni (Kan Yemini ve Asil Kurt) -----
  # Ekranın altında, istemci mod'unun cizdigi satir. Basamak, kabiliyet
  # basladigindan beri VERILEN TOPLAM HASAR ile yukselir - oldurulen yaratik
  # sayisiyla degil, cunku bir tavukla bir ravager ayni sey degildir.
  # <hasar> o ana kadarki toplam hasardir. Son iki basamak ekranda titrer.
  kombo-1: "Güzel!"
  kombo-2: "Devam et. (<hasar>)"
  kombo-3: "Durmayı aklından bile geçirme. (<hasar>)"
  kombo-4: "HIZINI KESME! (<hasar>)"
  kombo-5: "AKLINI MI KAÇIRDIN?! (<hasar>)"
  kombo-6: "HEPSİNİ ÖLDÜR!? (<hasar>)"
  kazma-gerekli: "<red><simge:uyari> <kabiliyet> için elinde bir kazma tutmalısın.</red>"
  yanlis-sinif: "<red><kabiliyet> kabiliyetini kullanmak için doğru sınıfa sahip olmalısın.</red>"
  tetiklendi: "<green><kabiliyet> tetiklendi.</green>"
  secildi: "<green><kabiliyet> seçildi.</green> <gray>Uygun aleti eline al ve çift sağ tıkla.</gray>"
  secim-bekleme: "<yellow>Farklı bir kabiliyet seçmeden önce <sure> beklemelisin.</yellow>"
  # Cift sag tik onayi: ilk tiklamada eylem cubugunda bu yazi cikar, ikinci
  # tiklama kabiliyeti gercekten calistirir (ya da yaratici modda kapatir).
  onay-aktif: "<yellow><simge:kabiliyet> <kabiliyet> kabiliyetini aktif etmek için tekrar sağ tıkla</yellow>"
  onay-kapat: "<yellow><simge:kabiliyet> <kabiliyet> kabiliyetini kapatmak için tekrar sağ tıkla</yellow>"
  kapatildi: "<yellow><simge:kabiliyet> Kabiliyet kapatıldı.</yellow>"
  cikarildi: "<yellow><simge:kabiliyet> Kuşandığın kabiliyeti çıkardın.</yellow> <gray>Yeni bir kabiliyet seçmek için bekleme süresi işlemeye devam eder.</gray>"
  geri-sayim: "<yellow><kabiliyet></yellow> <dark_gray>•</dark_gray> <white><kalan></white> <dark_gray>•</dark_gray> <aqua><simge:enerji> Enerji <white><mevcut></white><gray>/</gray><white><maksimum></white></aqua> <bar>"
  geri-sayim-enerji: "<yellow><kabiliyet></yellow> <dark_gray>•</dark_gray> <aqua><simge:enerji> Enerji <white><mevcut></white><gray>/</gray><white><maksimum></white></aqua> <bar>"
  geri-sayim-yaratici: "<yellow><kabiliyet></yellow> <dark_gray>•</dark_gray> <light_purple>Yaratıcı mod</light_purple> <dark_gray>•</dark_gray> <gray>Kapatmak için çift sağ tıkla</gray>"

