  kilometre-tasi-duyuru: "<blue><bold><simge:zenginlik> <oyuncu> <esik> zenginlik puanına ulaştı!</bold></blue>"
  # ----- Zenginlik sıralaması duyuruları -----
  # Bunlar "siralama-duyuru-araligi-dakika" (zenginlik.yml) periyoduyla, her
  # turda EN FAZLA BİR TANE olmak üzere tüm sunucuya gider. İki çeşit vardır:
  #   siralama-gecis-*   : bir oyuncu tam olarak bir kişiyi geçti.
  #                        <oyuncu> yükselen, <rakip> geçilen kişi,
  #                        <sira> yeni sıra, <zenginlik> yeni puan.
  #   siralama-yukselis-*: bir oyuncu birkaç basamak birden tırmandı.
  #                        <basamak> kaç sıra yükseldiği.
  # Aynı cümlenin sürekli tekrarlanmaması için her turda rastgele biri seçilir;
  # istediğiniz kadarını kendi üslubunuzla değiştirebilirsiniz.
  siralama-gecis-1: "<blue><simge:zenginlik> <oyuncu> aman tanımıyor!</blue> <gray><rakip>, <oyuncu> adlı oyuncunun gölgesinde kalarak <sira>. sıraya düştü.</gray>"
  siralama-gecis-2: "<blue><simge:zenginlik> <oyuncu>, <rakip> adlı oyuncuyu geride bıraktı</blue> <gray>ve zenginlikte <sira>. sıraya yerleşti.</gray>"
  siralama-gecis-3: "<blue><simge:zenginlik> Sıralama değişti:</blue> <white><oyuncu></white> <gray><rakip> adlı oyuncunun yerini aldı ve artık <sira>. sırada.</gray>"
  siralama-gecis-4: "<blue><simge:zenginlik> <oyuncu> kervanı çevirdi!</blue> <gray><rakip> bir basamak geriledi, <sira>. sıra artık <oyuncu> adlı oyuncunun.</gray>"
  siralama-gecis-5: "<blue><simge:zenginlik> <rakip> arkasına baktığında <oyuncu> adlı oyuncuyu göremedi</blue> <gray>- çünkü çoktan önüne geçmişti. Yeni sıra: <sira>.</gray>"
  siralama-gecis-6: "<blue><simge:zenginlik> <oyuncu>, <rakip> adlı oyuncunun servetini aştı</blue> <gray>ve <zenginlik> puanla <sira>. sıraya çıktı.</gray>"
  siralama-gecis-7: "<blue><simge:zenginlik> El değiştirdi!</blue> <gray><sira>. sıra artık <oyuncu> adlı oyuncunun; <rakip> bir basamak aşağıda.</gray>"
  siralama-gecis-8: "<blue><simge:zenginlik> <oyuncu> sessiz sedasız çalıştı</blue> <gray>ve <rakip> adlı oyuncuyu geçerek <sira>. sıraya oturdu.</gray>"
  siralama-yukselis-1: "<blue><simge:zenginlik> <oyuncu> önünde engel tanımıyor!</blue> <gray>Yükselişlerinin ardı arkası kesilmeyerek zenginlikte <sira>. sıraya ulaştı.</gray>"
  siralama-yukselis-2: "<blue><simge:zenginlik> <oyuncu> tek turda <basamak> basamak birden tırmandı</blue> <gray>ve <sira>. sıraya yerleşti.</gray>"
  siralama-yukselis-3: "<blue><simge:zenginlik> Kimse <oyuncu> adlı oyuncuyu durduramıyor:</blue> <gray><basamak> sıra birden yükselerek <sira>. sıraya çıktı.</gray>"
  siralama-yukselis-4: "<blue><simge:zenginlik> <oyuncu> merdivenleri ikişer ikişer çıkıyor!</blue> <gray><basamak> basamak yükseldi, artık <sira>. sırada.</gray>"
  siralama-yukselis-5: "<blue><simge:zenginlik> <oyuncu> adlı oyuncunun serveti <zenginlik> puana ulaştı</blue> <gray>ve <basamak> sıra birden atlayarak <sira>. sıraya geldi.</gray>"
  siralama-yukselis-6: "<blue><simge:zenginlik> Tablo <oyuncu> yüzünden yeniden yazıldı:</blue> <gray><basamak> basamak yukarı, doğruca <sira>. sıraya.</gray>"
