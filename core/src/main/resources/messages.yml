  kilometre-tasi-kapatildi: "<yellow><simge:eksik> Kilometre taşı özelliği kapatıldı.</yellow> <gray>İstediğin zaman aynı ekrandan geri açabilirsin.</gray>"

sinif:
  secildi: "<green><sinif> sınıfını seçtin.</green>"
  zaten-secili: "<yellow><sinif> zaten seçili sınıfın.</yellow>"
  bilinmeyen: "<red>Bilinmeyen sınıf:</red> <white><sinif></white>"
  bekleme: "<yellow>Sınıfını yeniden değiştirmek için <sure> beklemelisin.</yellow>"
  secim-yok: "<red>Önce bir sınıf seçmelisin.</red>"
