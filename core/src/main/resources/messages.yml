# =====================================================================
#  HalilIbrahimMMO - Mesaj Dosyası
# =====================================================================
#  Tüm metinler MiniMessage biçimindedir: <renk>, <gradient>, <bold> gibi
#  etiketler kullanabilirsiniz. Detaylı biçimlendirme rehberi için:
#  https://docs.advntr.dev/minimessage/format.html
