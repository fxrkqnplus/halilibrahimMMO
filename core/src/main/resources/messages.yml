  # Doguş duyurusu tüm sunucuya gider. <x>/<y>/<z> koordinatlar, <dunya>
  # dünyanın adıdır - herkesin bossa doğru yola çıkabilmesi için buradadır.
  dogus-siradan: "<gray><simge:boss> Sıradan bir boss belirdi:</gray> <white><isim></white> <dark_gray>•</dark_gray> <gray>Koordinat:</gray> <white><x>, <y>, <z></white>"
