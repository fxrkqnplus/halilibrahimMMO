# Dunya bosslari. Her nadirligin kendi rengi ve kendi metni vardir - bir
# nadirligin rengini degistirmek icin yalnizca bu satirlari duzenlemek yeter.
#   isim-*  : bossun basinin ustunde yazan ad
#   dogus-* : boss haritada belirdiginde tum sunucuya giden duyuru
#   olum-*  : boss oldurulduğunde tum sunucuya giden duyuru
#   kafa-*  : bossun geride biraktigi kafanin uzerindeki ad
boss:
