# HalilIbrahimMMO - Prestij ayarlari
# Oyuncu prestij yapabilmek icin ayni anda su 3 sarti saglamalidir:
#  1) ALTI becerinin (kazicilik/odunculuk/madencilik/avcilik/tarimcilik/
#     hayvancilik) her biri en az "gerekli-beceri-seviyesi" seviyesinde olmali,
#  2) secili sinifinin sinif seviyesi maksimum seviyede olmali (bkz classes.yml),
#  3) o sinifin sinerji becerilerinin HER BIRI, sinifin kendi
#     "prestij-sinerji-seviyesi" degerine ulasmis olmali (bkz classes.yml;
#     yazilmayan siniflarda bu deger skills.yml'deki maksimum seviyedir).
# Prestij; secili sinifin sinif seviyesini ve ALTI becerinin tumunu 1. seviye/0
# XP'ye sifirlar (Guc dusmez, kalici olarak "biriktirilir"), karsiliginda
# kalici +%50/rank XP bonusu ve sinifa ozel kalici bir bonus verir.
maksimum-prestij: 10
gerekli-beceri-seviyesi: 25

# Her prestijde yazilan Sayginlik Puani. Prestij sayginligi ASLA sifirlamaz -
# saygınlık "dunyadan ne cikardin" sorusunun cevabidir ve prestij bunu
# degistirmez; bu deger onun ustune eklenir.
prestij-sayginlik-odulu: 1000000

# HER PRESTIJDE BIR KALICI ODUL SECILIR.
# Prestij yapan oyuncunun onune bir secim ekrani gelir ve secimini yapana kadar
# diger MMO ekranlari acilmaz. Odul turleri kodda sabittir (her birinin gercek
# bir karsiligi olmali); burada yalnizca DEGERLERI ayarlanir. Bir secim
# harcandiginda geri alinamaz, ama ayni odul tekrar tekrar secilebilir.
#
#   CAN      : can puani olarak eklenir (2 puan = 1 kalp)
#   HASAR    : yaratiklara verilen hasara eklenen oran (0.05 = +%5)
#   ENERJI   : maksimum enerjiye eklenen puan
#   BILGELIK : BECERI XP'sine eklenen oran (0.10 = +%10). Sinerji becerisinden
#              gelen sinif XP'si de bu artistan pay alir, cunku o XP becerinin
#              verdigi miktarla aynadan gecer; dogrudan sinifa yazilan gorev
#              odulleri etkilenmez.
# ----- FIZIKSEL PRESTIJ ODULU (Faz 23) -----
# Kalici odulun YANINDA, her prestijde bir de bunlardan biri ALINMAK ZORUNDADIR.
# Kalici odul sonsuza kadar buyuyen bir sayidir ve o anda hicbir sey hissettirmez;
# bu ise elle tutulur, hemen kullanilir bir sey. Ikisi de zorunlu, ekran once
# kaliciyi sonra sandigi acar.
#
# Bu bolum TAMAMEN yapilandirmadir: yeni bir sandik eklemek icin kod
# degistirmeniz gerekmez. Iki kural vardir ve ikisi de dosyayi yuklemeyi
# engeller: en az IKI sandik olmali (tek secenek secim degildir) ve her sandik
# en az bir esya icermeli (bos sandik yalan soyleyen bir dugmedir).
#   gorunen-ad : ekranda gorunen ad
#   simge      : sandigi temsil eden Bukkit Material
#   esyalar    : { esya: <Material>, adet: <sayi> } listesi
fiziksel-oduller:
  savas-sandigi:
    gorunen-ad: "Savaş Sandığı"
    simge: NETHERITE_SWORD
    esyalar:
      - { esya: ENCHANTED_GOLDEN_APPLE, adet: 4 }
      - { esya: TOTEM_OF_UNDYING, adet: 2 }
      - { esya: NETHERITE_INGOT, adet: 2 }
  maden-sandigi:
    gorunen-ad: "Maden Sandığı"
    simge: DIAMOND_PICKAXE
    esyalar:
      - { esya: DIAMOND_BLOCK, adet: 6 }
      - { esya: ANCIENT_DEBRIS, adet: 4 }
      - { esya: EXPERIENCE_BOTTLE, adet: 32 }
  doga-sandigi:
    gorunen-ad: "Doğa Sandığı"
    simge: OAK_SAPLING
    esyalar:
      - { esya: BONE_BLOCK, adet: 16 }
      - { esya: GOLDEN_CARROT, adet: 32 }
      - { esya: LEAD, adet: 8 }
      - { esya: NAME_TAG, adet: 2 }
  kasif-sandigi:
    gorunen-ad: "Kâşif Sandığı"
    simge: FILLED_MAP
    esyalar:
      - { esya: ENDER_PEARL, adet: 16 }
      - { esya: FIREWORK_ROCKET, adet: 64 }
      - { esya: GOLDEN_APPLE, adet: 8 }

# Prestijde secilen kalici odullerin bir seferde ne kadar verdigi.
#
# FAZ 24: EKRAN ARTIK YALNIZCA ILK IKISINI SUNUYOR (CAN ve HASAR). Dort
# secenegin hepsi kucuk ve kalici oldugu icin dort secim bir karar degil bir
# menuydu; oyuncu her rankta ayni aciklamalari okuyup gecen sefer ne
# sectiyse onu seciyordu. Iki secenek gercek bir yol ayrimi: daha zor olmek
# ya da daha sert vurmak.
#
# ENERJI ve BILGELIK SILINMEDI ve degerleri hala okunuyor - daha once bu
# ikisinden alan oyuncularin bonusu aynen odenmeye devam ediyor. Silinselerdi
# o kayitlar sessizce hicbir seye karsilik gelmez olurdu.
kalici-oduller:
  CAN: 2
  HASAR: 0.05
  ENERJI: 15
  BILGELIK: 0.10
