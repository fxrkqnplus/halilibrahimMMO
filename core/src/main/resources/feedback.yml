# HalilIbrahimMMO - Geribildirim ayarlari
# Seviye atlama, gorev/koleksiyon tamamlama ve prestij anlarinda gosterilen
# boss cubugu ve ekran basligi kac saniye ekranda kalir.
sure-saniye: 5

# Her XP kazaniminda gosterilen ilerleme boss cubugunun, son kazanimdan
# itibaren kac saniye sonra gizlenecegi.
xp-cubugu-sure-saniye: 3

# Ses efektleri: her olay icin bir Bukkit Sound adi, ses seviyesi ve perde.
# Gecerli Sound adlari icin Paper/Bukkit Sound enum'una bakin.
sesler:
  seviye-atlama:
    ses: ENTITY_PLAYER_LEVELUP
    ses-seviyesi: 1.0
    ton: 1.0
  beceri-seviye-atlama:
    ses: ENTITY_EXPERIENCE_ORB_PICKUP
    ses-seviyesi: 1.0
    ton: 1.2
  sinif-seviye-atlama:
    ses: ENTITY_PLAYER_LEVELUP
    ses-seviyesi: 1.0
    ton: 0.8
  sinif-secildi:
    ses: BLOCK_ENCHANTMENT_TABLE_USE
    ses-seviyesi: 1.0
    ton: 1.0
  # Sinif DEGISTIRME anina ozel, secim sesinden daha gorkemli bir cue.
  sinif-degistirildi:
    ses: BLOCK_BEACON_POWER_SELECT
    ses-seviyesi: 1.0
    ton: 1.1
  # Prestij: sunucudaki en buyuk an, en gorkemli cue.
  prestij:
    ses: UI_TOAST_CHALLENGE_COMPLETE
    ses-seviyesi: 1.0
    ton: 1.0
  # Yalnizca MISTIK bir boss dogdugunda calar; yaninda elder guardian'in
  # ekrana cikan gorunusu de gelir. Yuz doguşta bir duyulan bir ses.
  boss-mistik:
    ses: ENTITY_ELDER_GUARDIAN_CURSE
    ses-seviyesi: 1.0
    ton: 1.0
  kabiliyet-secildi:
    ses: UI_BUTTON_CLICK
    ses-seviyesi: 0.9
    ton: 1.5
  kabiliyet-baslangic:
    ses: ITEM_TRIDENT_RIPTIDE_1
    ses-seviyesi: 0.8
    ton: 1.2
  kabiliyet-bitis:
    ses: ENTITY_ITEM_BREAK
    ses-seviyesi: 0.6
    ton: 1.0
  # Kabiliyet ekranindaki "Kabiliyeti Cikar" dugmesi.
  kabiliyet-cikarildi:
    ses: BLOCK_LEVER_CLICK
    ses-seviyesi: 0.8
    ton: 0.8
  # Yetenek agacinda bir puan harcandigi an.
  yetenek-acildi:
    ses: BLOCK_ENCHANTMENT_TABLE_USE
    ses-seviyesi: 1.0
    ton: 1.4
  # "/ev ayarla" ve "/ev" ile eve isinlanma.
  ev-ayarlandi:
    ses: BLOCK_RESPAWN_ANCHOR_SET_SPAWN
    ses-seviyesi: 1.0
    ton: 1.2
  ev-isinlanma:
    ses: ENTITY_ENDERMAN_TELEPORT
    ses-seviyesi: 0.9
    ton: 1.3
  # Takas daveti: gonderen kisa bir onay duyar, alan daha dikkat cekici bir cue.
  takas-istek-gonderildi:
    ses: BLOCK_NOTE_BLOCK_HAT
    ses-seviyesi: 0.8
    ton: 1.5
  takas-istek-alindi:
    ses: BLOCK_NOTE_BLOCK_BELL
    ses-seviyesi: 1.0
    ton: 1.2
  # Bir gorev tamamlandigi an.
  gorev-tamamlandi:
    ses: UI_TOAST_CHALLENGE_COMPLETE
    ses-seviyesi: 1.0
    ton: 1.2
  kabiliyet-acildi:
    ses: UI_TOAST_CHALLENGE_COMPLETE
    ses-seviyesi: 1.0
    ton: 1.0
  # "/rtp" ile haritada rastgele bir noktaya inildigi an.
  rastgele-isinlanma:
    ses: ENTITY_ENDERMAN_TELEPORT
    ses-seviyesi: 1.0
    ton: 1.0
  # Haritada yeni bir dunya bossu belirdiginde herkese calan uyari.
  # NOT: Asagidaki "boss-dogus-sesleri" listesi doluysa bu ses KULLANILMAZ;
  # liste bosaltilirsa eklenti bu tek sese geri doner.
  boss-belirdi:
    ses: ENTITY_ENDER_DRAGON_GROWL
    ses-seviyesi: 0.7
    ton: 0.8
  # Bir dunya bossu oldurulduğunde herkese calan zafer sesi.
  boss-olduruldu:
    ses: UI_TOAST_CHALLENGE_COMPLETE
    ses-seviyesi: 1.0
    ton: 0.9
  # Zenginlik Puani bir kilometre tasini asti.
  zenginlik-kilometre-tasi:
    ses: BLOCK_AMETHYST_BLOCK_CHIME
    ses-seviyesi: 1.0
    ton: 1.2

# Dunya bossu belirdiginde her oyuncuya bu listeden RASTGELE bir ses calar.
# Yarim saatte bir duyulan bir olay icin tek bir ses cabuk siradanlasiyor;
# burada ne kadar cesit tanimlarsaniz doguslar o kadar farkli duyulur.
# Listeyi tamamen bosaltirsaniz yukaridaki "boss-belirdi" sesi kullanilir.
boss-dogus-sesleri:
  - ses: ENTITY_ENDER_DRAGON_GROWL
    ses-seviyesi: 0.9
    ton: 0.7
  - ses: ENTITY_WITHER_SPAWN
    ses-seviyesi: 0.8
    ton: 0.9
  - ses: ENTITY_WARDEN_ROAR
    ses-seviyesi: 0.8
    ton: 1.0
  - ses: ENTITY_RAVAGER_ROAR
    ses-seviyesi: 1.0
    ton: 0.6
  - ses: ENTITY_ELDER_GUARDIAN_CURSE
    ses-seviyesi: 0.7
    ton: 0.8
  - ses: ENTITY_ILLUSIONER_PREPARE_BLINDNESS
    ses-seviyesi: 1.0
    ton: 0.7
  - ses: BLOCK_BELL_RESONATE
    ses-seviyesi: 1.0
    ton: 0.5
  - ses: ENTITY_ENDER_DRAGON_FLAP
    ses-seviyesi: 1.0
    ton: 0.5
