# HalilIbrahimMMO - Geribildirim ayarlari
# Seviye atlama, gorev/koleksiyon tamamlama ve prestij anlarinda gosterilen
# boss cubugu ve ekran basligi kac saniye ekranda kalir.
sure-saniye: 5

# Her XP kazaniminda gosterilen ilerleme boss cubugunun, son kazanimdan
# itibaren kac saniye sonra gizlenecegi.
xp-cubugu-sure-saniye: 3

# Ses efektleri: her olay icin bir Bukkit Sound adi, ses seviyesi ve perde.
# Gecerli Sound adlari icin Paper/Bukkit Sound enum'una bakin.
sesler:
  seviye-atlama:
    ses: ENTITY_PLAYER_LEVELUP
    ses-seviyesi: 1.0
    ton: 1.0
  beceri-seviye-atlama:
    ses: ENTITY_EXPERIENCE_ORB_PICKUP
    ses-seviyesi: 1.0
    ton: 1.2
  sinif-seviye-atlama:
    ses: ENTITY_PLAYER_LEVELUP
    ses-seviyesi: 1.0
    ton: 0.8
  sinif-secildi:
    ses: BLOCK_ENCHANTMENT_TABLE_USE
    ses-seviyesi: 1.0
    ton: 1.0
  # Sinif DEGISTIRME anina ozel, secim sesinden daha gorkemli bir cue.
  sinif-degistirildi:
    ses: BLOCK_BEACON_POWER_SELECT
    ses-seviyesi: 1.0
    ton: 1.1
  kabiliyet-secildi:
    ses: UI_BUTTON_CLICK
    ses-seviyesi: 0.9
    ton: 1.5
  kabiliyet-baslangic:
    ses: ITEM_TRIDENT_RIPTIDE_1
    ses-seviyesi: 0.8
    ton: 1.2
  kabiliyet-bitis:
    ses: ENTITY_ITEM_BREAK
    ses-seviyesi: 0.6
    ton: 1.0
  kabiliyet-acildi:
    ses: UI_TOAST_CHALLENGE_COMPLETE
    ses-seviyesi: 1.0
    ton: 1.0
  # "/rtp" ile haritada rastgele bir noktaya inildigi an.
  rastgele-isinlanma:
    ses: ENTITY_ENDERMAN_TELEPORT
    ses-seviyesi: 1.0
    ton: 1.0
  # Haritada yeni bir dunya bossu belirdiginde herkese calan uyari.
  boss-belirdi:
    ses: ENTITY_ENDER_DRAGON_GROWL
    ses-seviyesi: 0.7
    ton: 0.8
  # Bir dunya bossu oldurulduğunde herkese calan zafer sesi.
  boss-olduruldu:
    ses: UI_TOAST_CHALLENGE_COMPLETE
    ses-seviyesi: 1.0
    ton: 0.9
  # Zenginlik Puani bir kilometre tasini asti.
  zenginlik-kilometre-tasi:
    ses: BLOCK_AMETHYST_BLOCK_CHIME
    ses-seviyesi: 1.0
    ton: 1.2
