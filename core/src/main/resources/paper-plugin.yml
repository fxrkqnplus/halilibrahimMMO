name: HalilIbrahimMMO
version: ${version}
main: com.halilibrahim.halilibrahimmmo.HalilIbrahimMMOPlugin
loader: com.halilibrahim.halilibrahimmmo.HalilIbrahimMMOLoader
description: Türk Minecraft topluluğu için özgün MMORPG ilerleme eklentisi.
author: HalilIbrahim Studio
website: https://github.com/halilibrahim
api-version: '${apiVersion}'
load: STARTUP

dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  halilibrahimmmo.admin:
    description: "/haliladmin yönetici panelini açma izni (yeniden yükleme, hata ayıklama, sürüm bilgisi, çevrimiçi oyuncu bilgisi)."
    default: op
  hmmo.mod.bypass:
    description: "Zorunlu Fabric mod doğrulamasından muaf tutulma izni. Bu izne sahip oyuncuya mod listesi sorulmaz ve asla atılmaz."
    default: op
  hmmo.paket.bypass:
    description: "Zorunlu kaynak paketinden muaf tutulma izni. Bu izne sahip oyuncuya paket yine gönderilir (zorlamadan), ama reddetse veya indiremese de asla atılmaz."
    default: op
